<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StandIQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400..700&family=Public+Sans:wght@400..700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface-2:#F4F6F8; --line:#D5DDE5; --line-soft:#E3E8EE;
  --fg:#0E1C27; --muted:#40546A; --faint:#5A6E82;
  --accent:#0B7285; --accent-ink:#FFFFFF; --accent-soft:rgba(11,114,133,.10);
  --ok:#1F7A4F; --warn:#8A5A00; --bad:#B3261E; --violet:#5B4FC9; --blue:#2F63C9;
  --ok-soft:rgba(31,122,79,.10); --warn-soft:rgba(138,90,0,.10); --bad-soft:rgba(179,38,30,.09); --violet-soft:rgba(91,79,201,.10); --blue-soft:rgba(47,99,201,.10);
  --shadow:0 18px 40px -20px rgba(14,28,39,.35);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1826; --surface:#0F1D2E; --surface-2:#132437; --line:#22364D; --line-soft:#1A2B3F;
    --fg:#E6EDF3; --muted:#A9BACA; --faint:#8198AC;
    --accent:#5FD4E6; --accent-ink:#08121E; --accent-soft:rgba(95,212,230,.10);
    --ok:#4CC38A; --warn:#F2B84B; --bad:#F07167; --violet:#A69CF5; --blue:#7DAAF8;
    --ok-soft:rgba(76,195,138,.12); --warn-soft:rgba(242,184,75,.12); --bad-soft:rgba(240,113,103,.12); --violet-soft:rgba(166,156,245,.12); --blue-soft:rgba(125,170,248,.12);
    --shadow:0 18px 40px -20px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0C1826; --surface:#0F1D2E; --surface-2:#132437; --line:#22364D; --line-soft:#1A2B3F;
  --fg:#E6EDF3; --muted:#A9BACA; --faint:#8198AC;
  --accent:#5FD4E6; --accent-ink:#08121E; --accent-soft:rgba(95,212,230,.10);
  --ok:#4CC38A; --warn:#F2B84B; --bad:#F07167; --violet:#A69CF5; --blue:#7DAAF8;
  --ok-soft:rgba(76,195,138,.12); --warn-soft:rgba(242,184,75,.12); --bad-soft:rgba(240,113,103,.12); --violet-soft:rgba(166,156,245,.12); --blue-soft:rgba(125,170,248,.12);
  --shadow:0 18px 40px -20px rgba(0,0,0,.7);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:15px/1.5 'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.display{font-family:'Source Serif 4',Georgia,serif;font-variation-settings:'SOFT' 100,'opsz' 144;font-weight:800;letter-spacing:-.03em}
.tnum{font-variant-numeric:tabular-nums}
.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.i-sm{width:15px;height:15px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* top bar */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;height:64px;padding:0 20px;background:color-mix(in srgb,var(--bg) 88%,transparent);border-bottom:1px solid var(--line-soft);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg)}
.logo-mark{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:#132437}
.logo-word{font-size:21px}
.ws{display:inline-flex;align-items:center;gap:6px;margin-left:6px;padding:4px 10px;border:1px solid var(--line-soft);border-radius:9px;font-size:12px;font-weight:500;color:var(--muted)}
.ws svg{color:var(--accent)}
.spacer{flex:1}
.who{display:flex;align-items:center;gap:10px}
.avatar{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--violet-soft);color:var(--violet);font-size:12px;font-weight:700;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.who-txt b{display:block;font-size:13px;line-height:1.2}
.who-txt span{display:block;font-size:11.5px;color:var(--faint);line-height:1.2}
.iconbtn{display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:11px;background:transparent;color:var(--muted);cursor:pointer}
.iconbtn:hover{background:var(--surface-2);color:var(--fg)}
.menu-btn{display:none}

/* shell */
.shell{display:flex}
.side{position:sticky;top:64px;display:flex;flex-direction:column;width:256px;height:calc(100vh - 64px);padding:20px 12px;border-right:1px solid var(--line-soft);flex:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a,.nav span{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:11px;font-size:14px;font-weight:500;text-decoration:none;color:var(--muted)}
.nav a:hover{background:var(--surface-2);color:var(--fg)}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.nav span{color:var(--faint);opacity:.75;cursor:default}
.nav span em{margin-left:auto;font-style:normal;font-size:10.5px;font-weight:600;padding:0 6px;border:1px solid var(--line);border-radius:5px}
.nav-sep{margin:14px 12px 6px;font-size:12px;font-weight:600;color:var(--faint)}
.side-note{margin-top:auto;padding:12px;border:1px solid var(--line-soft);border-radius:12px;background:var(--surface);font-size:12px;line-height:1.5;color:var(--faint)}
main{flex:1;min-width:0;padding:28px 32px 48px}
.wrap{max-width:1400px;margin:0 auto}
.drawer{position:fixed;inset:0;z-index:40;display:none}
.drawer.open{display:block}
.drawer-bg{position:absolute;inset:0;border:0;background:rgba(0,0,0,.55);cursor:pointer}
.drawer-panel{position:absolute;top:0;bottom:0;left:0;width:288px;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));background:var(--bg);border-right:1px solid var(--line);overflow:auto}
@media (max-width:1023px){.side{display:none}.menu-btn{display:grid}main{padding:22px 16px 40px}.ws{display:none}}
@media (max-width:560px){.who-txt{display:none}}

/* headings */
.hello{margin:0;font-size:14px;color:var(--muted)}
.h1{margin:4px 0 0;font-size:34px;line-height:1.1}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}
.sub{margin:6px 0 0;max-width:62ch;color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:12px;border:1px solid transparent;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:disabled{cursor:not-allowed;opacity:.5}
.btn-p{background:var(--accent);color:var(--accent-ink)}
.btn-p:not(:disabled):hover{filter:brightness(1.08)}
.btn-s{background:var(--surface-2);border-color:var(--line);color:var(--fg)}
.btn-s:not(:disabled):hover{border-color:var(--accent)}
.btn-g{background:transparent;color:var(--muted)}
.btn-g:not(:disabled):hover{background:var(--surface-2);color:var(--fg)}
.btn-d{background:var(--bad-soft);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.btn-sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn-lg{height:48px;padding:0 20px;font-size:15px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:16px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line-soft)}
.card-h h2{margin:0;font-size:15px;font-weight:600}
.card-b{padding:20px}
.card-b.flush{padding:0}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1180px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.kpis{grid-template-columns:1fr}}
.kpi{display:flex;gap:16px;align-items:flex-start;padding:16px;background:var(--surface);border:1px solid var(--line-soft);border-radius:16px}
.kpi-ic{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;flex:none}
.kpi p{margin:0}
.kpi-l{font-size:13px;font-weight:500;color:var(--muted)}
.kpi-v{margin-top:2px!important;font-size:30px;line-height:1}
.kpi-h{margin-top:6px!important;font-size:12px;color:var(--faint)}
.t-cyan{background:var(--accent-soft);color:var(--accent)}.t-blue{background:var(--blue-soft);color:var(--blue)}.t-violet{background:var(--violet-soft);color:var(--violet)}.t-ok{background:var(--ok-soft);color:var(--ok)}.t-warn{background:var(--warn-soft);color:var(--warn)}.t-bad{background:var(--bad-soft);color:var(--bad)}.t-neutral{background:var(--surface-2);color:var(--muted)}
.grid2{display:grid;gap:20px;margin-top:20px;grid-template-columns:minmax(0,1fr) 380px}
@media (max-width:1180px){.grid2{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}

/* misc */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:7px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid color-mix(in srgb,currentColor 28%,transparent)}
.empty{display:flex;flex-direction:column;align-items:center;padding:36px 24px;text-align:center}
.empty-ic{display:grid;place-items:center;width:48px;height:48px;margin-bottom:14px;border-radius:14px;background:var(--surface-2);color:var(--muted)}
.empty b{font-weight:600}
.empty p{margin:6px 0 0;max-width:46ch;font-size:14px;color:var(--muted)}
.steps{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr));margin:0;padding:0;list-style:none}
@media (max-width:640px){.steps{grid-template-columns:1fr}}
.steps li{display:flex;gap:12px;padding:16px;border:1px solid var(--line-soft);border-radius:12px;background:var(--surface-2)}
.steps .n{font-size:26px;line-height:1;color:var(--accent)}
.steps b{display:block;font-weight:600}
.steps span.d{display:block;margin-top:2px;font-size:13.5px;color:var(--muted)}
.status-list{margin:-10px 0;padding:0;list-style:none}
.status-list li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.status-list li:last-child{border-bottom:0}
.status-list .l{flex:1;font-size:14px;color:var(--muted)}
.status-list .v{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;text-align:right}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.bar{display:flex;height:12px;overflow:hidden;border-radius:99px;background:var(--surface-2)}
.legend{display:grid;gap:8px 16px;grid-template-columns:repeat(4,minmax(0,1fr));margin:16px 0 0;padding:0;list-style:none}
@media (max-width:640px){.legend{grid-template-columns:repeat(2,minmax(0,1fr))}}
.legend li{display:flex;align-items:center;gap:8px;font-size:13px}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:none}
.legend .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.tl{margin:0;padding:0;list-style:none}
.tl li{position:relative;display:flex;gap:12px;padding-bottom:16px}
.tl li:last-child{padding-bottom:0}
.tl li:not(:last-child)::after{content:"";position:absolute;left:13px;top:30px;bottom:4px;width:1px;background:var(--line)}
.tl-ic{position:relative;z-index:1;display:grid;place-items:center;width:28px;height:28px;border-radius:8px;flex:none}
.tl p{margin:0;font-size:14px}
.tl small{display:block;font-size:12px;color:var(--faint)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;text-align:left}
th{padding:10px 20px;font-size:12px;font-weight:500;color:var(--faint);border-bottom:1px solid var(--line-soft);white-space:nowrap}
td{padding:12px 20px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tr:last-child td{border-bottom:0}
pre{margin:0;padding:12px;overflow-x:auto;border:1px solid var(--line-soft);border-radius:10px;background:var(--surface-2);font-size:12.5px;color:var(--muted)}
.field{width:100%;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--fg)}
.field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.label{display:block;margin-bottom:6px;font-size:13px;font-weight:500;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;font-size:14px}
.person{display:flex;align-items:center;gap:10px;min-width:0}
.person b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.center{display:flex;min-height:calc(100vh - 80px);align-items:center;justify-content:center;padding:32px 20px}
.gate{width:100%;max-width:560px;text-align:center}
.gate .h1{font-size:36px}
.gate p{color:var(--muted)}
.gate .choices{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:28px;text-align:left}
@media (max-width:560px){.gate .choices{grid-template-columns:1fr}}
.choice{display:flex;flex-direction:column;gap:6px;padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;text-align:left}
.choice:hover{border-color:var(--accent)}
.choice b{font-size:16px}
.choice span{font-size:13.5px;color:var(--muted)}
.results{margin-top:10px;border:1px solid var(--line-soft);border-radius:12px;overflow:hidden}
.results:empty{display:none}
.res{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line-soft)}
.res:last-child{border-bottom:0}
.loader{display:flex;align-items:center;justify-content:center;gap:10px;padding:40px;color:var(--muted)}
.spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;transform:translate(-50%,16px);opacity:0;padding:12px 18px;border-radius:12px;background:var(--fg);color:var(--bg);font-size:14px;box-shadow:var(--shadow);transition:.25s;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.dl{display:grid;gap:14px;margin:0}
.dl dt{font-size:12.5px;font-weight:500;color:var(--faint)}
.dl dd{margin:2px 0 0}

/* new analysis */
.tabs{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:13px;background:var(--surface-2);max-width:100%;overflow-x:auto;width:max-content}
.tab{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.14)}
textarea.field{height:auto;min-height:240px;padding:12px 14px;line-height:1.6;resize:vertical}
.form-grid{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
.form-grid .full{grid-column:1/-1}
@media (max-width:640px){.form-grid{grid-template-columns:1fr}}
.hint{margin:6px 0 0;font-size:12.5px;color:var(--faint)}
.err{margin:6px 0 0;font-size:13px;color:var(--bad)}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:36px 20px;border:2px dashed var(--line);border-radius:14px;background:var(--surface-2);text-align:center;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
#na-file:focus-visible + .drop{outline:2px solid var(--accent);outline-offset:3px}
.drop b{font-size:15px}
.drop span{font-size:13px;color:var(--muted)}
.fcard{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.fcard .kpi-ic{width:42px;height:42px}
.fcard b{display:block;word-break:break-all}
.chips{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;font-size:13px;color:var(--muted)}
.textview{max-height:440px;overflow:auto;padding:14px 16px;border:1px solid var(--line-soft);border-radius:12px;background:var(--surface-2);font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.pg{display:block;margin:18px 0 6px;font-size:12px;font-weight:700;color:var(--faint);white-space:normal}
.pg:first-child{margin-top:0}
.stages{margin:0;padding:0;list-style:none}
.stages li{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:14px}
.stages li:last-child{border-bottom:0}
.stages .st{display:grid;place-items:center;width:24px;height:24px;border-radius:7px;flex:none}
.stages .when{margin-left:auto;font-size:12px;color:var(--faint);white-space:nowrap}
.stages li.next{color:var(--faint)}
.kv{display:grid;gap:12px 18px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));margin:0}
.kv dt{font-size:12.5px;font-weight:500;color:var(--faint)}
.kv dd{margin:2px 0 0;word-break:break-word}
/* requirement review */
.rq-group{margin-top:18px}.rq-group:first-of-type{margin-top:0}
.rq-group h3{margin:0 0 8px;font-size:12.5px;font-weight:700;color:var(--faint)}
.rq-list{margin:0;padding:0;list-style:none;border:1px solid var(--line-soft);border-radius:12px;overflow:hidden}
.rq-item{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line-soft);background:var(--surface)}
.rq-item:last-child{border-bottom:0}
.rq-item.removed{opacity:.6}.rq-item.removed .rq-val{text-decoration:line-through}
.rq-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px}
.rq-label{font-size:13.5px;color:var(--muted)}
.rq-val{font-weight:600}
.rq-src{margin-left:auto;font-size:11.5px;color:var(--faint);white-space:nowrap}
.rq-src.officer{color:var(--warn);font-weight:600}
.rq-acts{display:flex;gap:2px;flex:none}
.ev{margin:8px 0 0;padding:8px 12px;border-left:3px solid var(--line);border-radius:0 8px 8px 0;background:var(--surface-2);font-size:13.5px;line-height:1.55;color:var(--muted)}
.ev mark{background:var(--accent-soft);color:var(--fg);padding:0 2px;border-radius:3px;font-weight:600}
.ev-p{display:block;margin-top:4px;font-size:11.5px;font-weight:600;color:var(--faint)}
.rq-add{margin-bottom:16px;padding:14px;border:1px dashed var(--accent);border-radius:12px;background:var(--accent-soft)}
.rq-legend{display:grid;gap:8px;margin-top:10px;font-size:13px;color:var(--muted)}
.gaps{margin:0;padding:0;list-style:none}
.gaps li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.gaps li:last-child{border-bottom:0}
.gaps b{display:block;font-size:14px}.gaps span{display:block;font-size:13px;color:var(--muted)}
/* standards, review, report */
.rec{border:1px solid var(--line-soft);border-radius:14px;padding:16px;margin-bottom:12px;background:var(--surface)}
.rec.on{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.rec-top{display:flex;gap:12px;align-items:flex-start}
.rec-num{font-size:16px}.rec-title{margin:6px 0 0;font-size:14px;color:var(--muted)}
.score{text-align:right;flex:none}.score b{display:block;font-size:26px;line-height:1}.score span{font-size:11px;color:var(--faint)}
.sel{display:grid;place-items:center;width:28px;height:28px;flex:none;cursor:pointer}.sel input{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}

.ff{--fw:156px;--fh:106px;--open:540ms;--close:320ms;--stag:48ms;position:relative;display:grid;grid-template-columns:var(--fw) minmax(0,1fr);gap:22px;align-items:end;height:178px;margin-top:10px}

  background:#D8C79D;border-radius:2px 2px 3px 3px;color:#2B2718;box-shadow:0 -6px 16px -8px rgba(23,25,29,.35);transform:perspective(560px) rotateX(-12deg);transform-origin:50% 100%;
  transition:transform var(--open) cubic-bezier(.23,1,.32,1)}

  background:#FFFDF6;color:#17191D;border:1px solid #D9D1B8;border-radius:2px;font:500 13.5px/1 var(--sans);cursor:pointer;
  box-shadow:0 1px 0 #E8E1CC,0 8px 18px -12px rgba(23,25,29,.55);

/* ---------------------------------------------------------------- profiles */
var pending={};
function wantProfiles(ids){
  if(!S.user)return;
  var need=ids.filter(function(id){return id&&!S.profiles[id]&&!pending[id];});
  if(!need.length)return;
  need.forEach(function(id){pending[id]=1;});
  S.user.profiles(need).then(function(ps){
    need.forEach(function(id){delete pending[id];S.profiles[id]=(ps&&ps[id])||{id:id,name:''};});
    schedule();
  }).catch(function(){need.forEach(function(id){delete pending[id];});});
}
function nameOf(id){if(!id)return 'Unknown account';if(id===S.uid)return (S.profiles[id]&&S.profiles[id].name)||(S.me&&S.me.name)||'You';var p=S.profiles[id];return (p&&p.name)||'Someone';}
function avatarOf(id){
  var p=S.profiles[id]||(id===S.uid?S.me:null);var nm=nameOf(id);
  var ini=nm.split(/\s+/).filter(Boolean).slice(-2).map(function(x){return x[0];}).join('').toUpperCase()||'?';
  if(p&&p.avatarUrl)return '<span class="avatar"><img src="'+esc(p.avatarUrl)+'" alt=""></span>';
  return '<span class="avatar" aria-hidden="true">'+esc(ini)+'</span>';
}

/* ---------------------------------------------------------------- audit writes (append-only per person) */
var auditChain=Promise.resolve();
function record(action,extra){
  if(!S.db||!S.uid)return Promise.resolve();
  var ev=Object.assign({id:rid(),ts:new Date().toISOString(),action:action,actor:S.uid},extra||{});
  auditChain=auditChain.then(function(){
    var ref=S.db.doc('audit/'+S.uid);
    return ref.get().then(function(snap){
      var prev=(snap.exists&&Array.isArray(snap.data().events))?snap.data().events:[];
      return ref.set({events:prev.concat([ev]).slice(-400)});
    });
  }).catch(function(e){console.warn('Audit write failed',e&&e.code);});
  return auditChain;
}

/* ---------------------------------------------------------------- role writes */
function assignRole(target,role){
  if(!S.canEdit)return;
  var prev=S.roles[target]?S.roles[target].role:null;
  if(prev===role)return;
  S.busy=true;schedule();
  S.db.doc('roles/'+target).set({role:role,assigned_by:S.uid,assigned_at:new Date().toISOString()})
    .then(function(){return record('ROLE_ASSIGN',{entity_type:'user',entity_id:target,before:prev?{role:prev}:null,after:{role:role}});})
    .then(function(){toast((target===S.uid?'Your role':nameOf(target)+'’s role')+' is now '+ROLE_LABEL[role].toLowerCase()+'.');})
    .catch(function(e){toast(e&&e.code==='invalid_argument'?'Only people who can edit this page can assign roles.':'The role could not be saved. Try again.');})
    .then(function(){S.busy=false;schedule();});
}
function revokeRole(target){
  if(!S.canEdit||target===S.uid)return;
  var prev=S.roles[target]?S.roles[target].role:null;
  S.busy=true;schedule();
  S.db.doc('roles/'+target).delete()
    .then(function(){return record('ROLE_REVOKE',{entity_type:'user',entity_id:target,before:{role:prev},after:null});})
    .then(function(){toast(nameOf(target)+' no longer has a StandIQ role.');})
    .catch(function(){toast('The role could not be removed. Try again.');})
    .then(function(){S.busy=false;schedule();});
}

/* ---------------------------------------------------------------- routing */
function myRole(){return S.roles[S.uid]?S.roles[S.uid].role:null;}
function route(){return (location.hash||'#/dashboard').replace(/^#/,'');}
function go(r){if(location.hash!=='#'+r)location.hash=r;else schedule();}
window.addEventListener('hashchange',function(){S.drawer=false;S.openEvent=null;schedule();window.scrollTo(0,0);});

/* ---------------------------------------------------------------- render scheduling (keeps focus) */
var queued=false;
function schedule(){if(queued)return;queued=true;requestAnimationFrame(function(){queued=false;render();});}
function render(){
  var a=document.activeElement,fid=a&&a.id,sel=null;
  if(fid&&a.setSelectionRange&&typeof a.selectionStart==='number')sel=[a.selectionStart,a.selectionEnd];
  app.innerHTML=view();
  try{thUpdate();}catch(e){}
  if(fid){var el=document.getElementById(fid);if(el){el.focus();if(sel&&el.setSelectionRange)try{el.setSelectionRange(sel[0],sel[1]);}catch(e){}}}
}

/* ---------------------------------------------------------------- views */

  if(S.phase==='boot')return '<div class="loader" role="status"><span class="spin" aria-hidden="true"></span>Checking your session…</div>';
  if(S.phase==='outside')return gateOutside();
  if(!S.rolesReady)return '<div class="loader" role="status"><span class="spin" aria-hidden="true"></span>Loading your workspace…</div>';
  var role=myRole(),r=route();
  if(!role){
    if(S.isOwner&&Object.keys(S.roles).length===0)return gateSetup();
    if(S.canEdit&&r==='/people')return shell(pagePeople());
    return gateNoRole();
  }
  var page,m;
  if(r==='/account')page=pageAccount();
  else if(r==='/people'&&S.canEdit)page=pagePeople();
  else if(r==='/audit'&&role==='STANDARDS_EXPERT')page=pageAudit();
  else if(r==='/new'&&role==='PROCUREMENT_OFFICER')page=pageNew();

  else if((m=r.match(/^\/analysis\/([^/]+)\/([^/]+)$/)))page=pageAnalysis(decodeURIComponent(m[1]),decodeURIComponent(m[2]));
  else if((m=r.match(/^\/report\/([^/]+)\/([^/]+)$/)))page=pageReport(decodeURIComponent(m[1]),decodeURIComponent(m[2]));
  else if((m=r.match(/^\/standard\/([^/]+)(?:\/([^/]+)\/([^/]+))?$/)))page=pageStandard(decodeURIComponent(m[1]),m[2]&&decodeURIComponent(m[2]),m[3]&&decodeURIComponent(m[3]));
  else if(r==='/kb')page=pageKB();
  else if(r==='/find')page=pageFind();
  else if(r==='/coverage')page=pageCoverage();
  else if(r==='/portal')page=pagePortal();
  else if(r==='/alerts')page=pageAlerts();
  else if((m=r.match(/^\/compare\/([^/]+)\/([^/]+)(?:\/([^/]+)\/([^/]+))?$/)))page=pageCompare(decodeURIComponent(m[1]),decodeURIComponent(m[2]),m[3]&&decodeURIComponent(m[3]),m[4]&&decodeURIComponent(m[4]));
  else if((m=r.match(/^\/kb\/edit\/(.+)$/)))page=pageKBEdit(decodeURIComponent(m[1]));
  else if(r==='/pending'&&role==='PROCUREMENT_OFFICER')page=pageOfficerList('pending');
  else if(r==='/reports'&&role==='PROCUREMENT_OFFICER')page=pageOfficerList('reports');
  else if(r==='/history')page=pageHistory();
  else if(r==='/reviews'&&role==='STANDARDS_EXPERT')page=pageQueue();
  else if(r==='/relationships')page=pageRelationships();
  else if(r==='/amendments')page=pageAmendments();
  else if(r==='/certifications')page=pageCerts();
  else if(r==='/categories')page=pageCategories();
  else if((m=r.match(/^\/specgen(?:\/([^/]+))?$/)))page=pageSpecGen(m[1]&&decodeURIComponent(m[1]));
  else if(r==='/learning')page=pageLearning();
  else if(r==='/language')page=pageLanguage();
  else if(r==='/bids')page=pageBidList();
  else if((m=r.match(/^\/bids\/([^/]+)\/([^/]+)$/)))page=pageBids(decodeURIComponent(m[1]),decodeURIComponent(m[2]));
  else if(r==='/verify')page=pageVerify();
  else if(r==='/insights')page=pageInsights();

/* ---- shared pieces */
function kpi(label,value,icon,tone,hint){
  return '<div class="kpi"><div class="kpi-ic t-'+tone+'">'+ic(icon)+'</div><div><p class="kpi-l">'+esc(label)+'</p><p class="kpi-v display tnum">'+value+'</p>'+(hint?'<p class="kpi-h">'+esc(hint)+'</p>':'')+'</div></div>';
}
function card(title,body,action,flush){
  return '<section class="card">'+(title?'<header class="card-h"><h2>'+title+'</h2>'+(action||'')+'</header>':'')+'<div class="card-b'+(flush?' flush':'')+'">'+body+'</div></section>';
}
function empty(icon,title,body){return '<div class="empty"><div class="empty-ic">'+ic(icon)+'</div><b>'+esc(title)+'</b>'+(body?'<p>'+body+'</p>':'')+'</div>';}
function statusCounts(list){var c={};STATUS.forEach(function(s){c[s[0]]=0;});list.forEach(function(a){var st=effStatus(a);if(c[st]!=null)c[st]++;});return c;}
function breakdown(counts,title){
  var total=STATUS.reduce(function(n,s){return n+counts[s[0]];},0),bar='';
  if(total)STATUS.forEach(function(s){if(counts[s[0]])bar+='<span style="width:'+(counts[s[0]]/total*100)+'%;background:'+s[2]+'"></span>';});
  var aria=total?STATUS.filter(function(s){return counts[s[0]];}).map(function(s){return s[1]+': '+counts[s[0]];}).join(', '):'No analyses yet';
  var lg='<ul class="legend">'+STATUS.map(function(s){return '<li><span class="sw" style="background:'+s[2]+'"></span><span class="nm">'+s[1]+'</span><b class="tnum">'+counts[s[0]]+'</b></li>';}).join('')+'</ul>';
  return card(title,'<div class="bar" role="img" aria-label="'+esc(aria)+'">'+bar+'</div>'+lg,'<span class="tnum faint" style="font-size:13px">'+total+' total</span>');
}
function systemStatus(){
  function row(icon,l,v,c){return '<li><span class="faint">'+ic(icon)+'</span><span class="l">'+l+'</span><span class="v"><span class="dot" style="background:'+c+'"></span>'+v+'</span></li>';}
  return card('System status','<ul class="status-list">'+
    row('shield','Sign-in','Verified by Claude account','var(--ok)')+
    row('db','Shared storage',S.storageOk?'Connected':'Unavailable',S.storageOk?'var(--ok)':'var(--bad)')+
    row('cpu','Intelligence mode','Local only, no external AI','var(--ok)')+
    row('check','Learning from experts',S.learning?(S.learning.enabled===false?'Off':'Model v'+S.learning.version+(agreementLine()?' · '+agreementLine():'')):'No model yet',S.learning&&S.learning.enabled!==false?'var(--ok)':'var(--faint)')+
    row('text','Language (Bhashini)',bhReady()?'Connected in this tab':'Not connected',bhReady()?'var(--ok)':'var(--faint)')+
    row('lib','Standards knowledge base',KB().filter(function(x){return !x.archived;}).length+' standards, '+KB().filter(function(x){return !x.archived&&x.data_status==='VERIFIED';}).length+' verified','var(--ok)')+'</ul>');
}
function timeline(events,showUser){
  if(!events.length)return '<p class="muted" style="margin:0;font-size:14px">No activity recorded yet.</p>';
  wantProfiles(events.map(function(e){return e.actor;}).concat(events.map(function(e){return e.entity_id;})));
  return '<ol class="tl">'+events.map(function(e){
    var lab=actionLabel(e.action),txt=showUser?'<b>'+esc(nameOf(e.actor))+'</b> '+esc(lab.charAt(0).toLowerCase()+lab.slice(1)):esc(lab);
    if(/^ROLE_/.test(e.action)&&e.entity_id)txt+=' '+(e.action==='ROLE_ASSIGN'?'for ':'from ')+'<b>'+esc(e.entity_id===e.actor?'themselves':nameOf(e.entity_id))+'</b>'+(e.after&&e.after.role?': '+esc(ROLE_LABEL[e.after.role].toLowerCase()):'');
    return '<li><span class="tl-ic t-'+actionTone(e.action)+'">'+ic(actionIcon(e.action),'i-sm')+'</span><div><p>'+txt+'</p><small><time datetime="'+esc(e.ts)+'">'+rel(e.ts)+'</time></small></div></li>';
  }).join('')+'</ol>';
}
function statusBadge(s){var m=STATUS.filter(function(x){return x[0]===s;})[0];return m?'<span class="badge" style="color:'+m[2]+'">'+m[1]+'</span>':'<span class="badge">'+esc(s)+'</span>';}
function analysesTable(list,showOwner){
  wantProfiles(list.map(function(a){return a.owner_id;}));

   '</tbody></table></div>';
}
function sortEvents(list){return list.slice().sort(function(a,b){return a.ts<b.ts?1:a.ts>b.ts?-1:0;});}

var LANG_LABEL={en:'English',hi:'Hindi',mixed:'English and Hindi',unknown:'Not determined'};

function freshNA(){return {mode:'text',title:'',category:'',purpose:'',quantity:'',application:'',text:'',file:null,touched:false,saving:false,saveError:null,progress:[]};}
function na(){if(!S.na)S.na=freshNA();return S.na;}
function fmtBytes(n){return n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(2)+' MB';}
function words(t){var m=String(t||'').trim().match(/\S+/g);return m?m.length:0;}
function detectLang(t){
  var dev=(t.match(/[\u0900-\u097F]/g)||[]).length,lat=(t.match(/[A-Za-z]/g)||[]).length,tot=dev+lat;
  if(tot<20)return 'unknown';var r=dev/tot;return r>0.8?'hi':r<0.05?'en':'mixed';
}
function cleanName(n){return String(n||'file').split(/[\\/]/).pop().replace(/[\u0000-\u001f\u007f]/g,'').slice(0,120)||'file';}
function normalize(t){return String(t||'').replace(/\r\n?/g,'\n').replace(/[ \t\u00a0]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();}

var scriptCache={};
function loadScript(src){
  if(scriptCache[src])return scriptCache[src];
  scriptCache[src]=new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.async=true;s.onload=res;
    s.onerror=function(){delete scriptCache[src];rej(new Error('lib'));};document.head.appendChild(s);});
  return scriptCache[src];
}
function ensurePdf(){
  if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);
  // Loading the worker as a plain script lets pdf.js run in this page, which blocks separate worker threads.
  return loadScript(LIB.pdfWorker).then(function(){return loadScript(LIB.pdf);}).then(function(){
    if(!window.pdfjsLib)throw new Error('lib');window.pdfjsLib.GlobalWorkerOptions.workerSrc=LIB.pdfWorker;return window.pdfjsLib;});
}
function ensureMammoth(){return window.mammoth?Promise.resolve(window.mammoth):loadScript(LIB.mammoth).then(function(){if(!window.mammoth)throw new Error('lib');return window.mammoth;});}
function readBuf(file){
  if(file.arrayBuffer)return file.arrayBuffer();
  return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result);};r.onerror=function(){rej(r.error);};r.readAsArrayBuffer(file);});
}
function sha256(buf){
  if(!(window.crypto&&crypto.subtle))return Promise.resolve(null);
  return crypto.subtle.digest('SHA-256',buf).then(function(h){return Array.prototype.map.call(new Uint8Array(h),function(b){return b.toString(16).padStart(2,'0');}).join('');});
}
function fail(code,msg){var e=new Error(msg);e.code=code;return e;}

/* Validate by extension, size and the file's real first bytes (never trust the name alone). */
function sniff(name,type,bytes){
  var ext=(name.match(/\.([A-Za-z0-9]+)$/)||[])[1];ext=ext?ext.toLowerCase():'';
  if(ext==='doc')throw fail('UNSUPPORTED','Older .doc files aren’t supported. Save it as .docx or PDF and try again.');
  if(['pdf','docx','txt'].indexOf(ext)<0)throw fail('UNSUPPORTED','Only PDF, DOCX and TXT files are supported.');
  var head=String.fromCharCode.apply(null,Array.prototype.slice.call(bytes,0,8));
  if(ext==='pdf'&&head.indexOf('%PDF-')!==0)throw fail('MISMATCH','This file is named .pdf but isn’t a PDF.');
  if(ext==='docx'&&head.indexOf('PK\u0003\u0004')!==0)throw fail('MISMATCH','This file is named .docx but isn’t a Word document.');
  if(ext==='txt'){for(var i=0;i<Math.min(bytes.length,4096);i++)if(bytes[i]===0)throw fail('MISMATCH','This file is named .txt but contains binary data.');}
  var okType={pdf:['application/pdf'],docx:['application/vnd.openxmlformats-officedocument.wordprocessingml.document','application/zip'],txt:['text/plain']}[ext];
  return {ext:ext,mime:(type&&okType.indexOf(type)>=0)?type:okType[0]};
}
function extractTxt(buf){
  var t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(buf);}catch(e){t=new TextDecoder('windows-1252').decode(buf);}
  t=normalize(t.replace(/^\uFEFF/,''));return {pages:[{page:1,text:t}],note:null};
}
function extractPdf(buf){
  return ensurePdf().then(function(lib){
    return lib.getDocument({data:new Uint8Array(buf),isEvalSupported:false,disableFontFace:true,useSystemFonts:false}).promise;
  }).catch(function(e){
    if(e&&e.name==='PasswordException')throw fail('ENCRYPTED','This PDF is password-protected. Remove the password and upload it again.');
    if(e&&e.message==='lib')throw fail('LIB','The PDF reader couldn’t load. Check your connection and try again.');
    throw fail('MALFORMED','This PDF couldn’t be read. It may be damaged.');
  }).then(function(doc){
    if(doc.numPages>MAX_PAGES)throw fail('TOO_LONG','This PDF has '+doc.numPages+' pages. The limit is '+MAX_PAGES+'.');
    var pages=[],i=1;
    function next(){
      if(i>doc.numPages)return pages;
      var n=i++;
      return doc.getPage(n).then(function(pg){return pg.getTextContent();}).then(function(tc){
        var out='';tc.items.forEach(function(it){if(typeof it.str==='string'){out+=it.str;out+=it.hasEOL?'\n':(it.str&&!/\s$/.test(it.str)?' ':'');}});
        pages.push({page:n,text:normalize(out)});return next();
      });
    }
    return next();
  }).then(function(pages){return {pages:pages,note:null};});
}
function extractDocx(buf){
  return ensureMammoth().catch(function(){throw fail('LIB','The Word reader couldn’t load. Check your connection and try again.');})
  .then(function(m){return m.extractRawText({arrayBuffer:buf});})
  .then(function(r){return {pages:[{page:null,text:normalize(r.value)}],note:'Word files have no fixed page numbers, so evidence will point to the text itself.'};},
        function(e){if(e&&e.code)throw e;throw fail('MALFORMED','This Word document couldn’t be read. It may be damaged.');});
}

function handleFile(file){
  var st=na();st.touched=true;
  var name=cleanName(file.name),t0=new Date().toISOString();
  st.file={name:name,size:file.size,status:'reading',error:null,stages:[{key:'INPUT_RECEIVED',at:t0}]};schedule();
  var info,buf;
  Promise.resolve().then(function(){
    if(file.size===0)throw fail('EMPTY','This file is empty.');
    if(file.size>MAX_BYTES)throw fail('TOO_LARGE','This file is '+fmtBytes(file.size)+'. The limit is 10 MB.');
    return readBuf(file);
  }).then(function(b){
    buf=b;info=sniff(name,file.type,new Uint8Array(buf,0,Math.min(buf.byteLength,4096)));
    st.file.kind=info.ext;st.file.mime=info.mime;st.file.stages.push({key:'DOCUMENT_VALIDATED',at:new Date().toISOString()});
    return Promise.all([sha256(buf),info.ext==='pdf'?extractPdf(buf):info.ext==='docx'?extractDocx(buf):extractTxt(buf)]);
  }).then(function(r){
    if(S.na!==st||st.file===null||st.file.name!==name)return;          // replaced meanwhile
    var pages=r[1].pages,all=pages.map(function(p){return p.text;}).join('\n\n');
    if(all.replace(/\s/g,'').length<20)throw fail('NO_TEXT',info.ext==='pdf'?'No selectable text was found. This looks like a scanned PDF, and scanned-page reading (OCR) isn’t available yet. Upload a text-based PDF or the Word file.':'No readable text was found in this file.');
    if(all.length>MAX_CHARS)throw fail('TOO_LONG','This document has '+all.length.toLocaleString()+' characters of text. The hosted version handles up to '+MAX_CHARS.toLocaleString()+'. Upload the technical specification section only.');
    st.file.stages.push({key:'TEXT_EXTRACTED',at:new Date().toISOString()});
    st.file.language=detectLang(all);st.file.stages.push({key:'LANGUAGE_DETECTED',at:new Date().toISOString()});
    st.file.sha256=r[0];st.file.pages=pages;st.file.note=r[1].note;st.file.words=words(all);st.file.chars=all.length;st.file.status='ok';
    if(!st.title.trim()||st.titleAuto){st.title=name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').trim().slice(0,120);st.titleAuto=true;}
    schedule();
  }).catch(function(e){
    if(S.na!==st||!st.file||st.file.name!==name)return;
    st.file.status='error';st.file.error=(e&&e.code)?e.message:'This file couldn’t be read.';schedule();
  });
}

/* Suggest a title from what was typed: a labelled Product/Item/Title/Subject line wins; otherwise the first line
   that isn't a generic heading such as "PROCUREMENT REQUIREMENT". */
function suggestTitle(text){
  var t=String(text||''),m=t.match(/^[ \t]*(?:product|item|title|subject|name of (?:the )?(?:item|work|goods))[ \t]*[:\-–][ \t]*(.{3,120})$/im);
  if(m)return m[1].trim().replace(/[.;]+$/,'').slice(0,100);
  var lines=t.split(/\n+/).map(function(x){return x.trim();}).filter(Boolean);
  for(var i=0;i<lines.length;i++){var l=lines[i];
    if(/^(procurement|technical|tender|scope|specification|requirements?|general|introduction|background|notice)(\s+(requirements?|specifications?|details|document|of work|conditions))*[:.]?$/i.test(l))continue;
    return l.replace(/\s+/g,' ').split(/(?<=[.!?।])\s/)[0].replace(/[.;:]+$/,'').slice(0,100);}
  return '';
}
function formProblems(){
  var st=na(),p={};
  if(!st.title.trim())p.title='Give the analysis a title.';
  else if(st.title.trim().length>150)p.title='Keep the title under 150 characters.';
  if(st.mode==='file'){
    if(!st.file)p.input='Choose a file to upload.';
    else if(st.file.status==='reading')p.input='Still reading the file…';
    else if(st.file.status==='error')p.input=st.file.error;
  }else{
    var n=st.text.trim().length;
    if(st.mode==='query'){if(n<8)p.input=n?'Add a few more words to the question.':'Type your question.';}
    else if(n<20)p.input=n?'Add a little more detail. At least 20 characters are needed.':'Enter the specification text.';
    else if(n>MAX_CHARS)p.input='This text is over '+MAX_CHARS.toLocaleString()+' characters.';
  }
  if(st.quantity.trim().length>60)p.quantity='Keep this under 60 characters.';
  return p;
}

function createAnalysis(){
  var st=na(),probs=formProblems();st.touched=true;
  if(st.saving)return;
  if(Object.keys(probs).length){
    toast(probs.title||probs.input||probs.quantity);schedule();
    setTimeout(function(){var el=document.getElementById(probs.title?'na-title':probs.input?(st.mode==='file'?'na-file':'na-text'):'na-quantity');
      if(el){if(el.scrollIntoView)el.scrollIntoView({block:'center'});el.focus();}},60);
    return;
  }
  st.saving=true;st.saveError=null;
  var now=new Date().toISOString(),id='a'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  var isFile=st.mode==='file',text=isFile?null:normalize(st.text);
  var stages=isFile?st.file.stages.slice():[{key:'INPUT_RECEIVED',at:now},{key:'DOCUMENT_VALIDATED',at:now},{key:'TEXT_EXTRACTED',at:now},{key:'LANGUAGE_DETECTED',at:now}];
  var body={
    owner_id:S.uid,title:st.title.trim(),input_type:isFile?'FILE':st.mode==='sample'?'SAMPLE':st.mode==='query'?'QUERY':'TEXT',
    category:st.category||null,purpose:st.purpose.trim()||null,quantity:st.quantity.trim()||null,application:st.application.trim()||null,department:String(st.department||'').trim()||null,
    original_text:text,language:isFile?st.file.language:detectLang(text),word_count:isFile?st.file.words:words(text),
    document:isFile?{filename:st.file.name,mime:st.file.mime,kind:st.file.kind,size:st.file.size,sha256:st.file.sha256,
      page_count:st.file.kind==='docx'?null:st.file.pages.length,note:st.file.note,pages:st.file.pages}:null,
    status:'DRAFT',stages:stages,created_at:now,updated_at:now
  };
  var bytes=new Blob([JSON.stringify(body)]).size;
  if(bytes>240000){st.saving=false;st.saveError='This analysis is too large to save in the hosted version ('+fmtBytes(bytes)+'). Shorten the text or upload only the specification section.';schedule();return;}
  var prof=runExtraction(Object.assign({},body,{id:id}));
  body.requirements=prof;body.requirements_original=clone(prof);
  body.language=prof.language;
  stages=stages.concat([{key:'REQUIREMENTS_EXTRACTED',at:prof.extracted_at},{key:'EVIDENCE_MAPPED',at:new Date().toISOString()}]);
  bytes=new Blob([JSON.stringify(body)]).size;
  if(bytes>240000){st.saving=false;st.saveError='This analysis is too large to save in the hosted version ('+fmtBytes(bytes)+'). Shorten the text or upload only the specification section.';schedule();return;}
  body.stages=stages.concat([{key:'SAVED',at:new Date().toISOString()}]);
  S.db.doc('analyses/'+S.uid+'/items/'+id).set(body).then(function(){
    record('CREATE_ANALYSIS',{analysis_id:id,entity_type:'analysis',entity_id:id,after:{title:body.title,input_type:body.input_type,category:body.category}});
    record('EXTRACT_REQUIREMENTS',{analysis_id:id,entity_type:'analysis',entity_id:id,after:{found:prof.items.length,missing:prof.missing.length,engine:prof.engine}});
    if(isFile)record('UPLOAD_DOCUMENT',{analysis_id:id,entity_type:'document',entity_id:id,after:{filename:body.document.filename,size:body.document.size,sha256:body.document.sha256,kind:body.document.kind,pages:body.document.page_count}});
    S.na=null;toast('Analysis saved as a draft.');go('/analysis/'+encodeURIComponent(S.uid)+'/'+encodeURIComponent(id));
  },function(e){
    st.saving=false;
    st.saveError=e&&e.code==='quota_exceeded'?'The workspace storage is full. Ask the owner to remove old analyses.':'The analysis couldn’t be saved. Check your connection and try again.';schedule();
  });
}

function pageAnalysis(owner,id){
  var role=myRole();

   Deterministic and local: no AI service is called. Every value keeps the sentence and page it came from.
   Status: EXPLICIT = stated with its value; DETECTED = concept named without a value; INFERRED = derived from
   another extracted fact (never a guessed number). Anything expected but absent is listed as missing. */
var ENGINE_VERSION='extract-1.0';
var REQ_GROUPS=[
  ['product','Product'],['purpose','Purpose'],['application','Application'],['quantity','Quantity'],['environment','Environment'],
  ['technical','Technical'],['performance','Performance'],['safety','Safety'],['installation','Installation'],['testing','Testing'],
  ['quality','Quality'],['certification','Certification'],['standards','Standards mentioned'],['constraints','Constraints & delivery']
];
var SCRIPTS=[['hi','Devanagari',/[\u0900-\u097F]/g],['bn','Bengali',/[\u0980-\u09FF]/g],['pa','Gurmukhi',/[\u0A00-\u0A7F]/g],['gu','Gujarati',/[\u0A80-\u0AFF]/g],
  ['or','Odia',/[\u0B00-\u0B7F]/g],['ta','Tamil',/[\u0B80-\u0BFF]/g],['te','Telugu',/[\u0C00-\u0C7F]/g],['kn','Kannada',/[\u0C80-\u0CFF]/g],['ml','Malayalam',/[\u0D00-\u0D7F]/g]];
var LANG_NAMES={en:'English',hi:'Hindi',bn:'Bengali',pa:'Punjabi',gu:'Gujarati',or:'Odia',ta:'Tamil',te:'Telugu',kn:'Kannada',ml:'Malayalam',mixed:'Mixed',unknown:'Not determined'};

/* Languages present, strongest first. Hindi and English are fully supported; others get value extraction only. */
function detectLanguages(t){
  var out=[],lat=(t.match(/[A-Za-z]/g)||[]).length;
  SCRIPTS.forEach(function(s){var n=(t.match(s[2])||[]).length;if(n>=6)out.push([s[0],n]);});
  if(lat>=15)out.push(['en',lat]);
  out.sort(function(a,b){return b[1]-a[1];});
  return out.map(function(x){return x[0];});
}
function langSummary(langs){if(!langs.length)return 'unknown';if(langs.length===1)return langs[0];return 'mixed';}

/* Indian-script digits → ASCII so values are read correctly. Original text is never changed. */
var DIGIT_BASES=[0x0966,0x09E6,0x0A66,0x0AE6,0x0B66,0x0BE6,0x0C66,0x0CE6,0x0D66];
function asciiDigits(s){
  return s.replace(/[\u0966-\u096F\u09E6-\u09EF\u0A66-\u0A6F\u0AE6-\u0AEF\u0B66-\u0B6F\u0BE6-\u0BEF\u0C66-\u0C6F\u0CE6-\u0CEF\u0D66-\u0D6F]/g,function(c){
    var cp=c.charCodeAt(0);for(var i=0;i<DIGIT_BASES.length;i++)if(cp>=DIGIT_BASES[i]&&cp<=DIGIT_BASES[i]+9)return String(cp-DIGIT_BASES[i]);return c;});
}

/* Sentences with page references. Guards common abbreviations so "No. 14" and "230.5 V" stay whole. */
function sentencesOf(pages){
  var out=[];
  pages.forEach(function(p){
    String(p.text||'').split(/\n+/).forEach(function(line){
      line=line.trim();if(!line)return;
      var start=0;
      for(var i=0;i<line.length;i++){
        var c=line[i];
        if(c==='।'||c==='!'||c==='?'||(c==='.'&&!/\d/.test(line[i+1]||'')&&!/\b(No|Nos|Sr|Dr|Mr|Ms|viz|approx|min|max|Fig|Vol|Rs|Cl|Sec|e\.g|i\.e|etc|Min|Max|Qty)$/.test(line.slice(start,i)))){
          if(/\s/.test(line[i+1]||' ')){var s=line.slice(start,i+1).trim();if(s)out.push({text:s,page:p.page});start=i+1;}
        }
      }
      var rest=line.slice(start).trim();if(rest)out.push({text:rest,page:p.page});
    });
  });
  return out;
}

/* The whole engine. pages: [{page, text}] → requirement profile. */
function extractRequirements(pages,meta){

      add(mkItem('standards','Standard referenced',ref,'EXPLICIT',s,sm[0].trim(),'standard reference',{std:{body:sm[1],number:sm[2],part:sm[3]||(sm[4]?'Part '+sm[4]:null),year:sm[5]?+sm[5]:null}}));

var GAP_ALIAS={'module efficiency':['efficiency'],'efficiency':['module efficiency'],'test reports':['testing required','accredited laboratory','inspection'],
  'key specifications':['power','capacity','dimensions'],'grade or variety':['grade'],'type or class':['grade']};
/* Recomputed after every edit, so adding a value clears its gap. */
function missingFor(profile){
  var active=profile.items.filter(function(i){return !i.removed;}),out=[];
  function has(group,label){
    var base=label.replace(/\s*\(.*\)$/,'').toLowerCase();
    return active.some(function(i){if(i.group!==group&&!(group==='certification'&&i.group==='certification'))return false;
      var l=i.label.toLowerCase().replace(/\s*\(.*\)$/,'');return l===base||(group==='certification'&&i.group==='certification')||(base==='power'&&/^power/.test(l))||(base==='protection'&&/protection/.test(l))||(GAP_ALIAS[base]||[]).indexOf(l)>=0;});
  }
  (profile.inputType==='QUERY'?[]:ALWAYS).concat(EXPECT[profile.productClass]||[]).forEach(function(e){if(!has(e[0],e[1]))out.push({group:e[0],label:e[1],why:e[2]});});
  if(!active.some(function(i){return i.group==='product';}))out.unshift({group:'product',label:'Product',why:'Standards are matched to the product first.'});
  return out;
}

function highlight(ev){
  if(!ev)return '';
  var t=ev.text||'',m=ev.match,ascii=asciiDigits(t),i=m?ascii.toLowerCase().indexOf(asciiDigits(m).toLowerCase()):-1;
  var q=i<0?esc(t):esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+m.length))+'</mark>'+esc(t.slice(i+m.length));
  return '<blockquote class="ev">“'+q+'”<span class="ev-p">'+(ev.page?'Page '+ev.page:'Source text')+'</span></blockquote>';

/* mutate(req) edits a copy and returns the audit details, or false to cancel. Audit is written only after the save succeeds. */
function saveReq(a,mutate){
  if(S.reqBusy)return;
  var req=clone(a.requirements),audit=mutate(req);
  if(audit===false||audit==null)return;
  req.missing=missingFor(req);req.updated_at=new Date().toISOString();
  S.reqBusy=true;schedule();
  S.db.doc(docPath(a)).update({requirements:req,updated_at:req.updated_at})
    .then(function(){S.reqEdit=null;S.reqAdd=null;S.reqDraft={};record('UPDATE_ANALYSIS',Object.assign({analysis_id:a.id,entity_type:'requirement'},audit));})
    .catch(function(){toast('The change couldn’t be saved. Try again.');})
    .then(function(){S.reqBusy=false;schedule();});
}
function doExtract(a){
  if(S.reqBusy)return;
  var prof=runExtraction(a),now=new Date().toISOString();
  var stages=(a.stages||[]).filter(function(s){return s.key!=='REQUIREMENTS_EXTRACTED'&&s.key!=='EVIDENCE_MAPPED';})
    .concat([{key:'REQUIREMENTS_EXTRACTED',at:now},{key:'EVIDENCE_MAPPED',at:new Date().toISOString()}]);
  S.reqBusy=true;schedule();
  S.db.doc(docPath(a)).update({requirements:prof,requirements_original:clone(prof),stages:stages,updated_at:now})
    .then(function(){record('EXTRACT_REQUIREMENTS',{analysis_id:a.id,entity_type:'analysis',entity_id:a.id,after:{found:prof.items.length,missing:prof.missing.length,engine:prof.engine}});toast('Requirements extracted.');})
    .catch(function(){toast('Extraction couldn’t be saved. Try again.');})
    .then(function(){S.reqBusy=false;schedule();});
}

function reqSection(a){
  var editable=canEditReq(a),req=a.requirements;
  if(!req){
    return card('Requirements',editable?empty('search','Requirements haven’t been extracted yet.','StandIQ will read the text and pull out each requirement with the sentence it came from.')+
      '<p style="text-align:center;margin:-14px 0 22px"><button class="btn btn-p" data-act="rq-extract"'+(S.reqBusy?' disabled':'')+'>'+ic('search')+'Extract requirements</button></p>'
      :empty('search','Requirements haven’t been extracted yet.','The officer who created this analysis runs extraction.'));
  }
  var active=req.items.filter(function(i){return !i.removed;}),removed=req.items.filter(function(i){return i.removed;});
  var edited=req.items.filter(function(i){return i.source==='OFFICER_EDITED'||i.source==='OFFICER_ADDED';}).length;
  var groups=REQ_GROUPS.map(function(g){

function missingSection(a){

app.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-act]');if(!t)return;var act=t.getAttribute('data-act');
  if(act.indexOf('rq-')!==0)return;
  var m=route().match(/^\/analysis\/([^/]+)\/([^/]+)$/);if(!m)return;
  var a=findAnalysis(decodeURIComponent(m[1]),decodeURIComponent(m[2]));if(!a)return;
  if(act==='rq-toggle-removed'){S.reqShowRemoved=!S.reqShowRemoved;schedule();return;}
  if(!canEditReq(a))return;
  var id=t.getAttribute('data-id');
  function find(req){for(var i=0;i<req.items.length;i++)if(req.items[i].id===id)return req.items[i];return null;}
  if(act==='rq-extract')doExtract(a);
  else if(act==='rq-edit'){S.reqEdit=id;S.reqAdd=null;S.reqDraft={};schedule();setTimeout(function(){var e=document.getElementById('rq-edit-val');if(e)e.focus();},30);}
  else if(act==='rq-cancel'){S.reqEdit=null;S.reqAdd=null;S.reqDraft={};schedule();}
  else if(act==='rq-save'){
    var v=(S.reqDraft.value!=null?S.reqDraft.value:'').trim();
    saveReq(a,function(req){var it=find(req);if(!it)return false;
      if(!v){toast('Enter a value, or use Remove instead.');return false;}
      if(v===it.value){S.reqEdit=null;schedule();return false;}
      var before={label:it.label,value:it.value};
      if(!it.original)it.original={value:it.value,status:it.status,source:it.source,evidence:it.evidence};
      it.value=v;if(it.source!=='OFFICER_ADDED')it.source='OFFICER_EDITED';it.edited_at=new Date().toISOString();
      return {entity_id:it.id,before:before,after:{label:it.label,value:v}};});
  }
  else if(act==='rq-remove'||act==='rq-restore'){
    var rm=act==='rq-remove';
    saveReq(a,function(req){var it=find(req);if(!it)return false;it.removed=rm;it.removed_at=rm?new Date().toISOString():null;
      var snap={label:it.label,value:it.value};
      return {entity_id:it.id,before:rm?snap:Object.assign({removed:true},snap),after:rm?Object.assign({removed:true},snap):snap,reason:rm?'Removed by officer during review':'Restored by officer'};});
  }
  else if(act==='rq-add-open'){S.reqAdd={group:t.getAttribute('data-group')||'technical',label:t.getAttribute('data-label')||''};S.reqEdit=null;S.reqDraft={label:S.reqAdd.label,group:S.reqAdd.group};schedule();
    setTimeout(function(){var e=document.getElementById(S.reqAdd&&S.reqAdd.label?'rq-add-val':'rq-add-label');if(e)e.focus();var c=document.querySelector('.rq-add');if(c&&c.scrollIntoView)c.scrollIntoView({block:'center'});},30);}
  else if(act==='rq-add-save'){
    var g=S.reqDraft.group||S.reqAdd.group,l=(S.reqDraft.label||'').trim(),val=(S.reqDraft.value||'').trim();
    if(!l||!val){toast('Enter both the requirement and its value.');return;}
    saveReq(a,function(req){var it={id:'r'+Math.random().toString(36).slice(2,9),group:g,label:l,value:val,status:'EXPLICIT',evidence:null,source:'OFFICER_ADDED',removed:false,original:null,concept:null,added_at:new Date().toISOString()};
      req.items.push(it);return {entity_id:it.id,before:null,after:{group:g,label:l,value:val},reason:'Added by officer during review'};});
  }
});

/* ---- effective knowledge base = seed + expert overrides (kb/<id> documents) */
S.kbOverrides={};S.kbReady=false;S.weights=null;
function kbAll(){
  var map={};KB_STANDARDS.forEach(function(s){map[s.standard_id]=s;});
  Object.keys(S.kbOverrides).forEach(function(id){var o=S.kbOverrides[id];map[id]=Object.assign({},map[id]||S_({}),o,{standard_id:id,_edited:true});});
  return Object.keys(map).map(function(k){return map[k];});
}
var _kbCache=null,_kbKey='';
function KB(){var key=JSON.stringify(Object.keys(S.kbOverrides).map(function(k){return [k,S.kbOverrides[k].updated_at];}));if(!_kbCache||key!==_kbKey){_kbCache=kbAll();_kbKey=key;_idx=null;}return _kbCache;}
function kbGet(id){var all=KB();for(var i=0;i<all.length;i++)if(all[i].standard_id===id)return all[i];return null;}
function weights(){return Object.assign({},DEFAULT_WEIGHTS,S.weights||{});}
function isActiveStd(s){return !s.archived&&s.status==='CURRENT';}

/* ---- text similarity */
function toks(t){return String(t||'').toLowerCase().replace(/[^a-z0-9\u0900-\u097F]+/g,' ').split(' ').filter(function(w){return w.length>1&&!STOP[w];}).map(function(w){return w.length>4?w.replace(/(ies)$/,'y').replace(/(s)$/,''):w;});}
var _idx=null;
function tfidfIndex(){
  if(_idx)return _idx;
  var docs=KB(),df={},vecs={};
  docs.forEach(function(s){var seen={};toks([s.title,s.scope,s.keywords.join(' '),s.synonyms.join(' '),s.product_category].join(' ')).forEach(function(w){if(!seen[w]){seen[w]=1;df[w]=(df[w]||0)+1;}});});
  var N=docs.length;function idf(w){return Math.log(1+N/(1+(df[w]||0)));}
  docs.forEach(function(s){var tf={};toks([s.title,s.title,s.scope,s.keywords.join(' '),s.synonyms.join(' '),s.product_category].join(' ')).forEach(function(w){tf[w]=(tf[w]||0)+1;});
    var v={},n=0;Object.keys(tf).forEach(function(w){v[w]=(1+Math.log(tf[w]))*idf(w);n+=v[w]*v[w];});vecs[s.standard_id]={v:v,n:Math.sqrt(n)||1};});
  _idx={vecs:vecs,idf:idf};return _idx;
}
function textCos(qt,id){
  var ix=tfidfIndex(),d=ix.vecs[id];if(!d)return 0;var tf={};qt.forEach(function(w){tf[w]=(tf[w]||0)+1;});
  var dot=0,qn=0;Object.keys(tf).forEach(function(w){var q=(1+Math.log(tf[w]))*ix.idf(w);qn+=q*q;if(d.v[w])dot+=q*d.v[w];});
  return qn?dot/(Math.sqrt(qn)*d.n):0;
}
function expandConcepts(list){
  var out={};list.forEach(function(c){out[c]=Math.max(out[c]||0,1);var g=CONCEPT_GRAPH[c];if(g)Object.keys(g).forEach(function(k){out[k]=Math.max(out[k]||0,g[k]*.6);});});return out;
}
function conceptCos(q,s){
  var sc={};s.concepts.forEach(function(c){sc[c]=1;var g=CONCEPT_GRAPH[c];if(g)Object.keys(g).forEach(function(k){sc[k]=Math.max(sc[k]||0,g[k]*.4);});});
  var dot=0,qn=0,sn=0,shared=[];Object.keys(q).forEach(function(k){qn+=q[k]*q[k];if(sc[k]){dot+=q[k]*sc[k];if(q[k]>=.6&&sc[k]>=.9)shared.push(k);}});
  Object.keys(sc).forEach(function(k){sn+=sc[k]*sc[k];});
  return {v:(qn&&sn)?dot/Math.sqrt(qn*sn):0,shared:shared};
}

var TEXT_CONCEPTS=[
