/* Translate, keeping standard numbers, units and values untouched. Returns {text, provider}. */
function translateText(src,tgt,text){
  text=String(text||'').slice(0,4500);if(!text.trim())return Promise.resolve({text:'',provider:null});if(src===tgt)return Promise.resolve({text:text,provider:'none'});
  if(bhReady()){
    var parts=text.split(/\n/);  // line by line keeps the structure and each call small
    return parts.reduce(function(p,line){return p.then(function(acc){if(!line.trim())return acc.concat(['']);return bhTranslate(src,tgt,line).then(function(t){return acc.concat([t]);});});},Promise.resolve([]))
      .then(function(l){return {text:l.join('\n'),provider:'Bhashini'};});
  }
  var sm=window.claude&&window.claude.use?window.claude.use('sample'):Promise.resolve(null);
  return sm.then(function(sample){if(!sample)throw {code:'no_provider'};
    return sample.json('Translate the text below from '+langName(src)+' into '+langName(tgt)+'. Keep every standard number (for example IS 10322 (Part 5/Sec 3):2026), unit, number, code (IP66, CRS, ISI) and line break exactly as written. Do not add or remove content.\nReply with JSON only: {"text":"..."}\n\nTEXT:\n'+text,{modelTier:'quick',cache:true});
  }).then(function(j){if(!j||typeof j.text!=='string')throw {code:'bad_reply'};return {text:j.text,provider:'Claude'};});
}
function trError(e){var c=e&&e.code;return c==='no_provider'?'No translation service here. Connect Bhashini in Language & voice.':c==='bh_auth'?'Bhashini refused the keys. Check the user ID and API key.':c==='bh_network'?'Bhashini couldn’t be reached from this page. The hosted page may block outside connections; the file or server version can reach it.':c==='bh_unsupported'?'Bhashini has no model for that language pair.':c==='not_granted'?'Claude translation was declined in this view.':'The translation didn’t complete.';}

function voiceStop(){if(VOICE.rec){try{VOICE.rec.stop();}catch(e){}}VOICE.on=false;schedule();}

    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      var mr=new MediaRecorder(stream),chunks=[];VOICE={on:true,target:target,rec:mr,stream:stream,chunks:chunks,busy:false};

/* Browser audio → 16 kHz mono 16-bit WAV, base64 (what Bhashini ASR expects). */

    function s(o,t){for(var i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i));}
    s(0,'RIFF');v.setUint32(4,36+n*2,true);s(8,'WAVE');s(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,16000,true);v.setUint32(28,32000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);s(36,'data');v.setUint32(40,n*2,true);

}

/* ================================================================ 2a. BID EVALUATION
   After the tender closes, each bid is checked against the expert-approved analysis: does it cite the verified
   standards and the right edition, is there a test report from an accredited lab, is the required certification
   stated with a licence or registration number, and do the offered values meet the specification? The bid file
   is read in the browser; StandIQ keeps the results, short evidence excerpts and the file's fingerprint. */
var BID_ENGINE='bideval-1.0';
var LIC_RE={CRS:/\bR\s?-\s?(\d{8})\b|\bR(\d{8})\b/g,ISI:/\bCM\s?\/\s?L\s?-?\s?(\d{7,10})\b/gi,HUID:/\bHUID\s*(?:no\.?|number|:)?\s*([A-Z0-9]{6})\b/g,NABL:/\b(T[CL])\s?-?\s?(\d{4,5})\b/g};
var CMP_MIN={'IP rating':'ip','IK rating':'num','Luminous efficacy (lm/W)':'num','Warranty':'months','Power (Wp)':'num','Efficiency':'num','Colour rendering (CRI)':'num','Rated life':'num','Luminous flux':'num'};
var CMP_EQ=['Voltage','Frequency','Colour temperature (K)','Grade','Power (W)','Power (kW / kVA)','Cross-section (mm²)','Number of cores','Diameter (mm)','Cell technology'];
function numOf(v){var m=String(v).replace(/,/g,'').match(/-?\d+(?:\.\d+)?/);return m?+m[0]:null;}
function monthsOf(v){var n=numOf(v);if(n==null)return null;return /month/i.test(v)?n:n*12;}
function ipCmp(req,off){var a=String(req).match(/IP\s?([0-6X])([0-9X])/i),b=String(off).match(/IP\s?([0-6X])([0-9X])/i);if(!a||!b)return null;
  function d(x){return x.toUpperCase()==='X'?0:+x;}return d(b[1])>=d(a[1])&&d(b[2])>=d(a[2]);}
function licencesIn(text){
  var out=[],seen={};function add(type,num,ok){var k=type+num;if(seen[k])return;seen[k]=1;out.push({type:type,number:num,format_ok:ok});}
  var t=String(text),m;
  LIC_RE.CRS.lastIndex=0;while((m=LIC_RE.CRS.exec(t)))add('CRS','R-'+(m[1]||m[2]),true);

/* ================================================================ 2b. SUPPLIER CERTIFICATE VERIFICATION
   Checks a BIS licence, CRS registration, HUID or NABL certificate number: format, whether that scheme is the one
   the knowledge base records for the product, and whether the standard claimed is current. A live lookup of
   validity needs BIS to allow it (data partnership); until then the officer confirms on the BIS website and the
   result is recorded with a note, so the check is auditable. */
var CERT_TYPES={
  CRS:{label:'BIS registration (CRS)',re:/^R-?\d{8}$/,fmt:'R- followed by 8 digits',scheme:'CRS',norm:function(v){var d=v.replace(/[^0-9]/g,'');return d.length===8?'R-'+d:v.toUpperCase();}},
  ISI:{label:'BIS licence (ISI mark)',re:/^CM\/L-?\d{7,10}$/,fmt:'CM/L- followed by 7 to 10 digits',scheme:'BIS_CERTIFICATION',norm:function(v){var d=v.replace(/[^0-9]/g,'');return d.length>=7?'CM/L-'+d:v.toUpperCase();}},
  HUID:{label:'Hallmark unique ID (HUID)',re:/^[A-Z0-9]{6}$/,fmt:'6 letters or digits',scheme:'HALLMARKING',norm:function(v){return v.toUpperCase().replace(/[^A-Z0-9]/g,'');}},
  NABL:{label:'NABL laboratory accreditation',re:/^T[CL]-\d{4,5}$/,fmt:'TC- or TL- followed by 4 or 5 digits',scheme:null,norm:function(v){var m=v.toUpperCase().match(/(T[CL])\s*-?\s*(\d{4,5})/);return m?m[1]+'-'+m[2]:v.toUpperCase();}}
};

  want.forEach(function(u){if(vfSubs[u])return;try{vfSubs[u]=S.db.collection('verifications/'+u+'/items').onSnapshot(function(snap){S.vfByUser[u]=snap.docs.map(function(d){return Object.assign({},d.data(),{id:d.id});}).filter(function(x){return x.by===u;});schedule();},function(e){storageFail(e);});}catch(e){}});

function vfCheck(){
  var v=S.vf,T=CERT_TYPES[v.type],num=T.norm(v.number.trim()),out=[];if(!v.number.trim())return null;
  out.push(T.re.test(num)?{status:'pass',text:'Format is valid ('+T.fmt+').'}:{status:'fail',text:'Format isn’t valid. Expected '+T.fmt+'. Check the number with the supplier.'});
  if(v.product&&T.scheme){var rules=KB_CERTS.filter(function(r){return r.products.indexOf(v.product)>=0;}),P=productById(v.product);
    if(!rules.length)out.push({status:'warn',text:'The knowledge base records no compulsory certification for '+P.label.toLowerCase()+'. The certificate may still be valid.'});
    else{var sch=rules.map(function(r){return r.scheme;}),match=sch.indexOf(T.scheme)>=0||(T.scheme==='BIS_CERTIFICATION'&&sch.indexOf('QCO')>=0);
      out.push(match?{status:'pass',text:P.label+' comes under '+rules.map(function(r){return SCHEME_LABEL[r.scheme];}).join(' / ')+', which matches this certificate type.'}:{status:'fail',text:P.label+' comes under '+rules.map(function(r){return SCHEME_LABEL[r.scheme];}).join(' / ')+', not '+T.label+'. Ask for the right certificate.'});}}
  if(v.std){var s=kbGet(v.std),cur=s&&currentOf(s);if(s)out.push(cur.standard_id!==s.standard_id||s.status!=='CURRENT'?{status:'warn',text:s.is_number+' is recorded as '+s.status.toLowerCase()+'. The current edition is '+cur.is_number+'. Check which edition the licence covers.'}:{status:'pass',text:s.is_number+' is the current edition.'});}
  out.push({status:'warn',text:'Live validity check: not connected. BIS lookups need the BIS data partnership. Confirm on the BIS website and record the result.'});
  return {number:num,checks:out};
}

}

/* ================================================================ 2c. INSIGHTS FOR POLICYMAKERS
   Aggregates every analysis this viewer can see: standards most often omitted, outdated editions cited, results by
   department, and the products that cause the most disputes. Export as CSV for DoCA and BIS. */
function insightsData(){
  var list=visibleAnalyses().filter(function(a){return a.recommendations&&a.input_type!=='QUERY';}),om={},old={},dep={},prod={},certMiss=0,total=list.length;
  list.forEach(function(a){var c=specCheck(a)||{findings:[]},rec=a.recommendations,d=(a.department||'').trim()||'Not stated',pid=rec.query.productId||'unknown',r=reviewOf(a);
    var D=dep[d]=dep[d]||{analyses:0,omitted:0,outdated:0,high:0,approved:0};D.analyses++;
    var Pp=prod[pid]=prod[pid]||{analyses:0,rejected:0,rounds:0,removed:0,bidFail:0,clarify:0};Pp.analyses++;
    c.findings.forEach(function(f){if(f.sev==='high')D.high++;
      if((f.kind==='Relevant standard not cited'||f.kind==='Consider citing')&&f.std){om[f.std]=(om[f.std]||0)+1;D.omitted++;}
      if(f.kind==='Certification not stated')certMiss++;});
    rec.versions.forEach(function(v){if(v.result==='VERSION_REVIEW'){old[v.ref]=old[v.ref]||{n:0,current:v.current};old[v.ref].n++;D.outdated++;}});
    var st=effStatus(a);if(st==='APPROVED')D.approved++;if(st==='REJECTED')Pp.rejected++;
    if(r){Pp.rounds+=(r.history||[]).filter(function(h){return h.status==='REVISION_REQUIRED'||h.status==='CLARIFICATION_REQUIRED';}).length+(['REVISION_REQUIRED','CLARIFICATION_REQUIRED'].indexOf(r.status)>=0?1:0);
      Pp.removed+=Object.keys(r.decisions||{}).filter(function(k){return r.decisions[k].d==='REMOVE';}).length;}
    (a.bids||[]).forEach(function(b){if(b.result.verdict==='NON_COMPLIANT')Pp.bidFail++;});
  });
  Object.keys(prod).forEach(function(k){var p=prod[k];p.score=p.rejected*3+p.rounds*2+p.removed+p.bidFail*2;});
  return {total:total,omitted:om,outdated:old,dep:dep,prod:prod,certMiss:certMiss};
}

  var omit=Object.keys(d.omitted).sort(function(a,b){return d.omitted[b]-d.omitted[a];}),omMax=omit.length?d.omitted[omit[0]]:0;
  var old=Object.keys(d.outdated).sort(function(a,b){return d.outdated[b].n-d.outdated[a].n;});

  function lst(items,fn){return items.length?'<ul class="alist">'+items.slice(0,10).map(fn).join('')+'</ul>':'<p class="muted" style="margin:0;font-size:14px">Nothing recorded yet.</p>';}
  return '<div class="head"><div><h1 class="h1 display">Insights for policymakers</h1><p class="sub">For the Department of Consumer Affairs and BIS: where specifications go wrong, across '+(exp?'every analysis in this workspace':'your analyses')+'.</p></div><button class="btn btn-s" data-act="in-csv"'+(d.total?'':' disabled')+'>Download CSV</button></div>'+
    '<div class="kpis">'+kpi('Specifications analysed',d.total,'clip','blue')+kpi('Relevant standards omitted',totalOm,'alert','bad',d.total?(totalOm/d.total).toFixed(1)+' per specification':'')+kpi('Outdated editions cited',totalOld,'layers','warn')+kpi('Certification not stated',d.certMiss,'award','violet','Where it is mandatory or conditional')+'</div>'+
    '<div class="grid2"><div class="stack">'+
      card('Standards most often omitted',lst(omit,function(id){var s=kbGet(id);return '<li><div style="flex:1;min-width:0"><a class="rowlink" href="#/standard/'+encodeURIComponent(id)+'">'+esc(stdNum(id))+'</a> <span class="muted">'+esc(s?s.title:'')+'</span>'+hbar(d.omitted[id],omMax,'var(--bad)')+'</div><b class="tnum">'+d.omitted[id]+'</b></li>';}))+
      card('Outdated editions cited',lst(old,function(k){var o=d.outdated[k];return '<li><div style="flex:1;min-width:0"><b>'+esc(k)+'</b>'+(o.current?' <span class="muted">→ current: '+esc(stdNum(o.current))+'</span>':'')+'</div><b class="tnum">'+o.n+'</b></li>';}))+
      card('Products causing the most disputes',prods.length?'<div class="tbl-wrap"><table style="min-width:620px"><thead><tr><th>Product</th><th>Rejected</th><th>Revision / clarification rounds</th><th>Standards removed by experts</th><th>Non-compliant bids</th><th>Index</th></tr></thead><tbody>'+prods.slice(0,10).map(function(k){var p=d.prod[k],P=productById(k);
        return '<tr><td>'+esc(P?P.label:'Not identified')+'</td><td class="tnum">'+p.rejected+'</td><td class="tnum">'+p.rounds+'</td><td class="tnum">'+p.removed+'</td><td class="tnum">'+p.bidFail+'</td><td style="min-width:120px">'+hbar(p.score,pMax,'var(--warn)')+'<span class="tnum faint" style="font-size:12px">'+p.score+'</span></td></tr>';}).join('')+'</tbody></table></div><p class="hint" style="padding:0 20px 14px">Index = 3 × rejected + 2 × rounds + removals + 2 × failed bids.</p>':'<div style="padding:20px"><p class="muted" style="margin:0;font-size:14px">No disputes recorded yet.</p></div>','',true)+'</div>'+
    '<div class="stack">'+card('By department',deps.length?'<div class="tbl-wrap"><table><thead><tr><th>Department</th><th>Specs</th><th>Omitted</th><th>Outdated</th></tr></thead><tbody>'+deps.map(function(k){var x=d.dep[k];return '<tr><td>'+esc(k)+'</td><td class="tnum">'+x.analyses+'</td><td class="tnum">'+x.omitted+'</td><td class="tnum">'+x.outdated+'</td></tr>';}).join('')+'</tbody></table></div>':'<div style="padding:20px" class="muted">No data yet.</div>','',true)+
      card('About this data','<ul class="conds" style="margin:0"><li>Findings come from the same specification check officers see on each analysis.</li><li>Departments come from the Department field on new analyses and drafted specifications.</li><li>At national scale this view would run on portal data (GeM, CPPP) through the StandIQ API.</li></ul>')+'</div></div>';
}

/* ================================================================ 3a. FULL BIS CATALOGUE: PARTNER INTAKE
   The realistic route to BIS's roughly 20,000 standards is a data partnership. Partner files (CSV or JSON) land in a
   staging queue; nothing reaches the knowledge base until a standards expert verifies each record against its
   source. */
var BIS_CATALOGUE_APPROX=20000;
S.stage={};S.stageReady=false;var stageSub=null;
function syncStage(){if(stageSub||!S.db||myRole()!=='STANDARDS_EXPERT')return;try{stageSub=S.db.collection('kbstage').onSnapshot(function(snap){var o={};snap.docs.forEach(function(d){o[d.id]=Object.assign({},d.data(),{_id:d.id});});S.stage=o;S.stageReady=true;schedule();},function(e){S.stageReady=true;storageFail(e);});}catch(e){}}
function idFromIS(num){var m=String(num||'').match(/^(IS\/IEC|IS\/ISO|IS|SP)\s*(\d+)(?:\s*\(([^)]+)\))?(?:\s*[:\-]\s*(\d{4}))?/i);if(!m)return null;
  var part=m[3]?m[3].replace(/part/i,'').replace(/sec(tion)?/i,'').replace(/[^0-9/]+/g,'').split('/').filter(Boolean).join('-'):'';
  return {id:[m[1].toUpperCase().replace('/','-'),m[2],part,m[4]||''].filter(Boolean).join('-'),body:m[1].toUpperCase(),number:m[2],part:m[3]||null,year:m[4]?+m[4]:null};}
var CAT_FIELDS=['is_number','title','scope','year','status','domain','product_category','keywords','source_url'];
function catRecords(text,isJSON){
  var arr=[];
  if(isJSON){var j=JSON.parse(text);arr=Array.isArray(j)?j:(j.standards||[]);}
  else{var rows=parseCSV(text);if(rows.length<2)return [];var h=rows[0].map(function(x){return x.trim().toLowerCase();});
    arr=rows.slice(1).map(function(r){var o={};h.forEach(function(k,i){o[k]=r[i]!=null?String(r[i]).trim():'';});return o;});}
  return arr.map(function(r){var p=idFromIS(r.is_number);if(!p||!r.title)return null;
    return {standard_id:(r.standard_id&&/^[A-Za-z0-9-]{3,60}$/.test(r.standard_id))?r.standard_id:p.id,is_number:String(r.is_number).trim(),body:p.body,number:p.number,part:p.part,year:+r.year||p.year,title:String(r.title).trim().slice(0,300),
      scope:String(r.scope||'').slice(0,1200),status:/supersed|withdraw/i.test(r.status||'')?(/withdraw/i.test(r.status)?'WITHDRAWN':'SUPERSEDED'):'CURRENT',domain:r.domain||'',product_category:r.product_category||'',
      keywords:Array.isArray(r.keywords)?r.keywords:String(r.keywords||'').split(/[;|,]/).map(function(x){return x.trim();}).filter(Boolean).slice(0,20),source_url:String(r.source_url||'').trim()};}).filter(Boolean);
}
function catImport(file){
  if(!kbEditor())return;if(file.size>3*1024*1024){toast('The file is over 3 MB. Split it into batches.');return;}
  readBuf(file).then(function(b){var txt=new TextDecoder().decode(b),recs=catRecords(txt,/\.json$/i.test(file.name));
    var fresh=recs.filter(function(r){return !kbGet(r.standard_id)&&!S.stage[r.standard_id];}).slice(0,200);
    if(!recs.length){toast('No usable rows. Each needs is_number and title.');return;}
    if(!fresh.length){toast('Every record in the file is already in the knowledge base or the queue.');return;}
    var batch='batch-'+todayISO()+'-'+rid().slice(-4),now=new Date().toISOString();
    return fresh.reduce(function(p,r){return p.then(function(){return S.db.doc('kbstage/'+r.standard_id).set(JSON.parse(JSON.stringify(Object.assign(r,{batch:batch,file:cleanName(file.name),imported_by:S.uid,imported_at:now}))));});},Promise.resolve())
      .then(function(){record('KB_STAGE_IMPORT',{entity_type:'catalogue',entity_id:batch,after:{file:cleanName(file.name),records:fresh.length,skipped:recs.length-fresh.length}});toast(fresh.length+' record(s) queued for expert verification.');});
  }).catch(function(){toast('That file couldn’t be read as CSV or JSON.');});
}
function catPublish(id){

  if(!/^https:\/\//.test(r.source_url||'')){toast('Add an https source link (the BIS record) before verifying.');S.catEdit=id;schedule();return;}
  var rec=S_({standard_id:r.standard_id,is_number:r.is_number,body:r.body,number:r.number,part:r.part,year:r.year,title:r.title,scope:r.scope||r.title,status:r.status,domain:r.domain,product_category:r.product_category,

function pilotMeasure(p){
  if(!p||!p.product)return null;var since=p.start||'0000',until=p.end||'9999';
  var list=visibleAnalyses().filter(function(a){var rec=a.recommendations;return rec&&rec.query&&rec.query.productId===p.product&&(!p.department||String(a.department||'').toLowerCase()===String(p.department).toLowerCase())&&(a.created_at||'')>=since&&(a.created_at||'').slice(0,10)<=until;});
  var approved=list.filter(function(a){return effStatus(a)==='APPROVED';}),days=approved.map(function(a){var r=reviewOf(a);return r&&r.decided_at?(new Date(r.decided_at)-new Date(a.created_at))/864e5:null;}).filter(function(x){return x!=null;});
  var flagged=0,fixed=0;list.forEach(function(a){var c=specCheck(a);if(c&&c.high)flagged++;});
  var disputes=list.reduce(function(n,a){var r=reviewOf(a);return n+(effStatus(a)==='REJECTED'?1:0)+((a.bids||[]).filter(function(b){return b.result.verdict==='NON_COMPLIANT';}).length);},0);
  return {analyses:list.length,approved:approved.length,avgDays:days.length?days.reduce(function(s,x){return s+x;},0)/days.length:null,flagged:flagged,disputes:disputes,
    bids:list.reduce(function(n,a){return n+(a.bids||[]).length;},0)};
}

var DEMO_KEY='standiq-demo-db-v1',DEMO_TAB='standiq-demo-user';
function demoLoad(){try{return JSON.parse(localStorage.getItem(DEMO_KEY)||'{}')||{};}catch(e){return {};}}
function demoSave(m){try{localStorage.setItem(DEMO_KEY,JSON.stringify(m));return true;}catch(e){return false;}}
function demoMerge(a,b){Object.keys(b).forEach(function(k){var v=b[k];if(v&&typeof v==='object'&&!Array.isArray(v)&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k]))demoMerge(a[k],v);else a[k]=v;});return a;}
function makeDemoRuntime(me){
  var listeners=[];
  function fire(){listeners.forEach(function(f){try{f();}catch(e){console.warn(e);}});}
  window.addEventListener('storage',function(ev){if(ev.key===DEMO_KEY)fire();});      // other tabs
  function depth(p){return p.split('/').length;}
  function snapDoc(path,m){return {id:path.split('/').pop(),exists:path in m,data:function(){return JSON.parse(JSON.stringify(m[path]||{}));}};}
  function write(fn){var m=demoLoad();var r=fn(m);if(r===false)return Promise.reject({code:'invalid_argument',message:'Document not found'});
    if(!demoSave(m))return Promise.reject({code:'quota_exceeded',message:'Browser storage is full'});setTimeout(fire,0);return Promise.resolve();}
  var db={
    collection:function(p){return {onSnapshot:function(next){var f=function(){var m=demoLoad();var docs=Object.keys(m).filter(function(k){return k.indexOf(p+'/')===0&&depth(k)===depth(p)+1;}).map(function(k){return snapDoc(k,m);});
      next({docs:docs,size:docs.length,empty:!docs.length});};listeners.push(f);setTimeout(f,0);return function(){listeners=listeners.filter(function(x){return x!==f;});};}};},
    doc:function(p){return {
      get:function(){return Promise.resolve(snapDoc(p,demoLoad()));},
      set:function(d){return write(function(m){m[p]=JSON.parse(JSON.stringify(d));});},
      update:function(d){return write(function(m){if(!(p in m))return false;demoMerge(m[p],JSON.parse(JSON.stringify(d)));});},
      delete:function(){return write(function(m){delete m[p];});},
      onSnapshot:function(next){var f=function(){next(snapDoc(p,demoLoad()));};listeners.push(f);setTimeout(f,0);return function(){listeners=listeners.filter(function(x){return x!==f;});};}
    };}
  };
  var byId={};DEMO_USERS.forEach(function(u){byId[u.id]={id:u.id,name:u.name,avatarUrl:'',isMe:u.id===me.id};});
  var user={me:function(){return Promise.resolve({id:me.id,name:me.name,avatarUrl:''});},isOwner:function(){return Promise.resolve(!!me.owner);},canEdit:function(){return Promise.resolve(!!me.owner);},
    profiles:function(ids){var o={};[].concat(ids).forEach(function(i){if(byId[i])o[i]=byId[i];});return Promise.resolve(o);},
    search:function(q){q=String(q||'').toLowerCase();return Promise.resolve(DEMO_USERS.filter(function(u){return !q||u.name.toLowerCase().indexOf(q)>=0;}).map(function(u){return byId[u.id];}));}};
  var downloads={save:function(o){var url=URL.createObjectURL(o.data instanceof Blob?o.data:new Blob([o.data]));var a=document.createElement('a');a.href=url;a.download=o.filename||'download';document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(url);a.remove();},1500);return Promise.resolve({});}};
  // First run: give the three demo accounts their roles so there's nothing to set up.
  var m=demoLoad(),changed=false;
  DEMO_USERS.forEach(function(u){if(!m['roles/'+u.id]){m['roles/'+u.id]={role:u.role,assigned_by:'demo-expert',assigned_at:new Date().toISOString()};changed=true;}});
  if(changed)demoSave(m);
  return {use:function(n){return Promise.resolve({user:user,db:db,downloads:downloads}[n]||null);}};
}
var AUTH_COLS=10,AUTH_ROWS=8;
function demoGate(){
  return new Promise(function(resolve){
    var saved=null;try{saved=sessionStorage.getItem(DEMO_TAB);}catch(e){}
    var u=DEMO_USERS.filter(function(x){return x.id===saved;})[0];if(u)return resolve(u);
    document.body.classList.add('auth-open');
    var ROLE={PROCUREMENT_OFFICER:'Procurement officer',STANDARDS_EXPERT:'Standards expert'};
    var cells='';for(var k=0;k<AUTH_COLS*AUTH_ROWS;k++)cells+='<span></span>';
    app.innerHTML='<div class="auth">'+
      '<section class="auth-art" aria-label="About StandIQ">'+
        '<div class="auth-brand"><span class="logo-mark" style="color:#E7E3D6">'+LOGO.replace(/var\(--accent\)/g,'#E7E3D6')+'</span><span class="logo-word display">StandIQ</span></div>'+
        '<div class="auth-field" aria-hidden="true" style="grid-template-columns:repeat('+AUTH_COLS+',1fr)">'+cells+'</div>'+
        '<div class="auth-copy"><h2 class="display">Every tender, pointed at the right standard.</h2>'+
          '<p>StandIQ reads a procurement specification and finds the Indian Standards that apply, the standards they depend on, the current edition and any mandatory certification. A standards expert signs off before anything is called verified.</p></div>'+
        '<p class="auth-foot">Smart India Hackathon 2026 · PS 26108 · Department of Consumer Affairs</p>'+
      '</section>'+
      '<section class="auth-main"><div class="auth-box">'+
        '<h1 class="display">Sign in</h1>'+
        '<p class="auth-sub">Everything you do is saved in this browser.</p>'+
        '<form class="auth-form" novalidate>'+
          '<div><label class="label" for="auth-email">Email</label><input id="auth-email" class="field" type="email" autocomplete="username" placeholder="name@standiq.local" required></div>'+
          '<div><div class="auth-pwrow"><label class="label" for="auth-pw">Password</label><button type="button" class="auth-show" data-auth="show" aria-pressed="false">Show</button></div>'+
            '<input id="auth-pw" class="field" type="password" autocomplete="current-password" required></div>'+
          '<p class="auth-err" id="auth-err" role="alert"></p>'+
          '<button type="submit" class="btn btn-p btn-lg auth-go">Sign in</button>'+
        '</form>'+
        '<div class="auth-demo"><div class="auth-rule"><span>Accounts</span></div><ul>'+
          DEMO_USERS.map(function(x){return '<li><div class="auth-who"><span class="auth-av" aria-hidden="true">'+esc(x.name.split(/\s+/).map(function(w){return w[0];}).slice(0,2).join(''))+'</span>'+
            '<div><b>'+esc(x.name)+'</b><span>'+esc(ROLE[x.role])+(x.owner?' · workspace owner':'')+'</span><code>'+esc(x.email)+' · '+esc(x.password)+'</code></div></div>'+
            '<button type="button" class="btn btn-s btn-sm" data-demo="'+x.id+'" aria-label="Use '+esc(x.name)+'’s suggested password">Use</button></li>';}).join('')+
        '</ul><p class="auth-note">Open a second tab and sign in as the expert to review the officer’s work live. For real sign-in and a shared team workspace, use the StandIQ link inside Claude.</p></div>'+
      '</div></section></div>';

    var field=app.querySelector('.auth-field'),lines=[].slice.call(field.querySelectorAll('span')),centres=[],reduce=REDUCE_MOTION;
    function measure(){centres=lines.map(function(el){var r=el.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2];});}
    /* Magnetic field: each line turns to face the pointer and grows longer and darker as the pointer nears. */
    function aim(px,py,strong){
      lines.forEach(function(el,i){var c=centres[i];if(!c)return;var dx=px-c[0],dy=py-c[1],d=Math.hypot(dx,dy)||1;
        var near=strong?Math.max(0,1-d/380):0;
        el.style.setProperty('--a',(Math.atan2(dy,dx)*180/Math.PI+90).toFixed(1)+'deg');
        el.style.setProperty('--s',(1+near*.95).toFixed(3));el.style.setProperty('--o',(.28+near*.72).toFixed(3));});
    }
    function rest(){var f=app.querySelector('.auth-main');if(!f)return;var r=f.getBoundingClientRect();aim(r.left+r.width*.3,r.top+r.height*.45,false);}
    var raf=0,last=null;
    function onMove(e){last=[e.clientX,e.clientY];if(raf||reduce)return;raf=requestAnimationFrame(function(){raf=0;aim(last[0],last[1],true);});}
    function onResize(){measure();if(last&&!reduce)aim(last[0],last[1],true);else rest();}
    measure();rest();
    window.addEventListener('pointermove',onMove,{passive:true});window.addEventListener('resize',onResize);

    var email=app.querySelector('#auth-email'),pw=app.querySelector('#auth-pw'),err=app.querySelector('#auth-err');
    function done(pick){
      try{sessionStorage.setItem(DEMO_TAB,pick.id);}catch(e){}
      window.removeEventListener('pointermove',onMove);window.removeEventListener('resize',onResize);
      app.removeEventListener('click',onClick);app.removeEventListener('submit',onSubmit);
      document.body.classList.remove('auth-open');resolve(pick);
    }
    function onClick(ev){
      var b=ev.target.closest('[data-demo]');
      if(b){var x=DEMO_USERS.filter(function(u){return u.id===b.getAttribute('data-demo');})[0];email.value=x.email;pw.value=x.password;err.textContent='';
        app.querySelectorAll('.auth-demo li').forEach(function(li){li.classList.toggle('on',li.contains(b));});pw.focus();return;}
      var s=ev.target.closest('[data-auth="show"]');
      if(s){var on=pw.type==='password';pw.type=on?'text':'password';s.textContent=on?'Hide':'Show';s.setAttribute('aria-pressed',String(on));}
    }
    function onSubmit(ev){
      ev.preventDefault();
      var e=email.value.trim().toLowerCase(),p=pw.value;
      if(!e||!p){err.textContent=!e?'Enter your email address.':'Enter your password.';(!e?email:pw).focus();return;}
      var x=DEMO_USERS.filter(function(u){return u.email===e&&u.password===p;})[0];
      if(!x){err.textContent='Email or password is incorrect. Use one of the accounts below.';pw.select&&pw.select();return;}
      done(x);
    }
    app.addEventListener('click',onClick);app.addEventListener('submit',onSubmit);
    setTimeout(function(){email.focus();},50);
  });
}

async function boot(){
  var c=window.claude;
  if(!c||typeof c.use!=='function'){
    /* Opened as a plain file: run the local demo instead of stopping. */
    try{var who=await demoGate();window.claude=c=makeDemoRuntime(who);S.demo=true;}catch(e){S.phase='outside';return schedule();}
  }
  var res=await Promise.all([c.use('user'),c.use('db')]);
  S.user=res[0];S.db=res[1];
  if(!S.user||!S.db){S.phase='outside';return schedule();}
  var info=await Promise.all([S.user.me(),S.user.isOwner(),S.user.canEdit()]);
  S.me=info[0];S.uid=info[0]&&info[0].id;S.isOwner=!!info[1];S.canEdit=!!info[2];
  if(!S.uid){S.phase='outside';return schedule();}
  S.profiles[S.uid]={id:S.uid,name:S.me.name||'',avatarUrl:S.me.avatarUrl||''};
  S.phase='ready';schedule();

  S.db.collection('roles').onSnapshot(function(snap){
    var m={};snap.docs.forEach(function(d){var v=d.data();if(v&&ROLE_LABEL[v.role])m[d.id]=v;});
    S.roles=m;S.rolesReady=true;logSessionOnce();try{syncAnalysisSubs();}catch(e){console.warn(e);}try{syncVerifySubs();syncStage();}catch(e){console.warn(e);}try{syncReviewSubs();}catch(e){console.warn(e);}schedule();
  },function(e){S.rolesReady=true;storageFail(e);});

  S.db.collection('audit').onSnapshot(function(snap){
    var all=[];snap.docs.forEach(function(d){var v=d.data();if(v&&Array.isArray(v.events))v.events.forEach(function(e){if(e&&e.actor===d.id)all.push(e);});});
    S.audit=all;S.auditReady=true;schedule();
  },function(e){S.auditReady=true;storageFail(e);});

  syncAnalysisSubs();
  /* Each subscription is independent: one failing must never stop the app from loading. */
  try{S.db.collection('kb').onSnapshot(function(snap){var o={};snap.docs.forEach(function(d){var v=d.data();if(v&&v.title)o[d.id]=v;});S.kbOverrides=o;S.kbReady=true;schedule();},function(e){S.kbReady=true;storageFail(e);});}catch(e){S.kbReady=true;console.warn('KB overrides unavailable');}
  ['learning','readiness','pilot'].forEach(function(k){try{S.db.doc('settings/'+k).onSnapshot(function(d){S[k]=d.exists?d.data():null;schedule();},function(){});}catch(e){console.warn('settings/'+k+' unavailable');}});
  try{S.db.doc('settings/weights').onSnapshot(function(d){var w=d.exists&&d.data().weights;if(w&&typeof w==='object'){var ok=Object.keys(DEFAULT_WEIGHTS).every(function(k){return typeof w[k]==='number'&&w[k]>=0&&w[k]<=1;});S.weights=ok?w:null;}schedule();},function(){});}catch(e){console.warn('Weights setting unavailable; using defaults');}
}
boot().catch(function(){S.phase='outside';schedule();});
})();
