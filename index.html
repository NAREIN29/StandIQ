 [/(?:road|highway|street|avenue|lane|flyover|carriageway|सड़क|मार्ग)/i,'road'],[/weather\s*-?proof|rain\s*-?proof|water\s*-?proof|dust\s*-?proof|splash/i,'ingress protection'],
 [/photovoltaic|\bsolar\b|सौर|सोलर/i,'photovoltaic'],[/hard\s*hats?|head\s*(?:gear|protection)|skull\s*guard/i,'head protection'],
 [/rebars?|reinforc/i,'reinforcement steel'],[/bottled\s+water|drinking\s+water|पेयजल|पीने का पानी/i,'packaged drinking water'],
 [/jewel|ornament|\b(?:22|18|14|24)\s*(?:carat|karat|kt)\b/i,'gold jewellery'],[/backup\s+power|power\s+backup|uninterrupt/i,'power backup'],
 [/grid[\s-]*(?:tie|connect)/i,'grid-connected'],[/binder|mortar|concrete\s+mix/i,'cement'],[/surveillance|security\s+camera/i,'video surveillance']
];
var INFER_FAMILY=[['lighting',['lighting','luminaire'],'Electrical','street-light',['road']],['solar',['photovoltaic'],'Solar',null,null],['ppe',['head protection'],'PPE','safety-helmet',null],
  ['steel',['reinforcement steel'],'Construction','steel-bars',null],['food',['packaged drinking water'],'Food','drinking-water',null],['it',['power backup'],'IT & electronics','ups',null]];

/* ---- build the query from the reviewed requirement profile (removed items excluded) */
function buildQuery(a){
  var req=a.requirements||{items:[],concepts:[]},act=req.items.filter(function(i){return !i.removed;});
  var prod=act.filter(function(i){return i.group==='product'&&i.label!=='Category';})[0];
  var productId=prod&&prod.productId?prod.productId:(req.productId||null);
  if(prod&&!productId){var hit=PRODUCTS.filter(function(P){return P.label.toLowerCase()===String(prod.value).toLowerCase()||P.re.some(function(r){return r.test(prod.value);});})[0];if(hit)productId=hit.id;}
  var P=PRODUCTS.filter(function(x){return x.id===productId;})[0];
  var concepts=(req.concepts||[]).slice();act.forEach(function(i){if(i.concept&&concepts.indexOf(i.concept)<0)concepts.push(i.concept);});
  if(P)P.concepts.forEach(function(c){if(concepts.indexOf(c)<0)concepts.push(c);});
  var hasLED=act.some(function(i){return /\bLED\b|एलईडी/i.test(i.value+' '+(i.evidence&&i.evidence.text||''));})||/\bLED\b|एलईडी/i.test(pagesOf(a).map(function(p){return p.text;}).join(' '));
  if(hasLED&&concepts.indexOf('LED')<0)concepts.push('LED');
  var text=[pagesOf(a).map(function(p){return p.text;}).join(' '),act.map(function(i){return i.label+' '+i.value;}).join(' '),a.title,a.purpose||'',a.application||''].join(' ');
  TEXT_CONCEPTS.forEach(function(t){if(t[0].test(text)&&concepts.indexOf(t[1])<0)concepts.push(t[1]);});
  if(concepts.indexOf('lighting')>=0&&concepts.indexOf('road')>=0&&concepts.indexOf('road lighting')<0)concepts.push('road lighting');
  var inferred=null;
  if(!productId){for(var fi=0;fi<INFER_FAMILY.length;fi++){var F=INFER_FAMILY[fi];
    if(F[1].some(function(c){return concepts.indexOf(c)>=0;})){inferred={family:F[0],domain:F[2]};
      if(F[3]&&(!F[4]||F[4].every(function(c){return concepts.indexOf(c)>=0;}))){productId=F[3];P=PRODUCTS.filter(function(x){return x.id===productId;})[0];inferred.product=P?P.label:null;}
      break;}}}
  var envApp=act.filter(function(i){return i.group==='environment'||i.group==='application'||i.group==='purpose';}).map(function(i){return String(i.value).toLowerCase();}).join(' ');
  var volt=act.filter(function(i){return i.label==='Voltage';}).map(function(i){var m=String(i.value).match(/(\d+(?:\.\d+)?)\s*(kV|V)/i);return m?(+m[1])*(/k/i.test(m[2])?1000:1):null;}).filter(function(v){return v!=null;});
  var kva=act.filter(function(i){return /kVA|kW/i.test(i.value);}).map(function(i){var m=String(i.value).match(/(\d+(?:\.\d+)?)\s*(k?VA|kW)/i);return m?(+m[1])/(/^VA$/i.test(m[2])?1000:1):null;}).filter(function(v){return v!=null;});
  var dia=act.filter(function(i){return /Diameter/.test(i.label);}).map(function(i){return parseFloat(i.value);}).filter(function(v){return !isNaN(v);});
  return {productId:productId,product:P||null,productLabel:prod?prod.value:(P?P.label:null),inferred:inferred,domain:P?P.domain:(inferred?inferred.domain:(req.domain||a.category||null)),family:P?P.cls:(inferred?inferred.family:null),
    concepts:concepts,expanded:expandConcepts(concepts),text:text.toLowerCase(),tokens:toks(text),envApp:envApp,volt:volt,kva:kva,dia:dia,hasLED:hasLED,items:act};
}
var FAMILY_OF_CLASS={lighting:'lighting',solar:'solar','solar-inv':'solar',battery:'solar',ppe:'ppe',cement:'cement',steel:'steel',pipes:'pipes',cable:'cable',it:'it',food:'food',general:null};

function scoreStandard(q,s,W){
  var cc=conceptCos(q.expanded,s),tc=textCos(q.tokens,s.standard_id);
  var semantic=Math.min(1,.65*cc.v+.35*Math.min(1,tc*1.6));
  var kws=s.keywords.concat(s.synonyms),hits=kws.filter(function(k){return q.text.indexOf(k.toLowerCase())>=0;});
  var keyword=kws.length?Math.min(1,hits.length/Math.min(3,kws.length)):0;
  var product=q.productId&&s.productIds.indexOf(q.productId)>=0?1:(q.family&&s.family&&FAMILY_OF_CLASS[q.family]===s.family?.45:0);
  var domain=q.domain&&s.domain===q.domain?1:0;
  var st=s.scopeTerms.filter(function(t){return q.text.indexOf(t.toLowerCase())>=0||q.concepts.some(function(c){return c.toLowerCase()===t.toLowerCase();});});
  var scope=s.scopeTerms.length?Math.min(1,st.length/Math.min(3,s.scopeTerms.length)):0,scopeNote=null,scopeWarn=null;
  if(s.limits&&s.limits.voltageMaxV&&q.volt.length){var mx=Math.max.apply(null,q.volt);
    if(mx<=s.limits.voltageMaxV){scope=Math.min(1,scope+.4);scopeNote='Your '+mx+' V supply is within its scope (up to '+s.limits.voltageMaxV+' V).';}
    else{scope=0;scopeWarn='Your '+mx+' V is above the '+s.limits.voltageMaxV+' V limit in its scope.';}}
  var app=s.application.filter(function(t){return q.envApp.indexOf(t)>=0||q.text.indexOf(' '+t)>=0;});
  var application=s.application.length?Math.min(1,app.length/2):0;
  var parts={semantic:semantic,keyword:keyword,product:product,domain:domain,scope:scope,application:application};
  var total=0;Object.keys(W).forEach(function(k){total+=W[k]*(parts[k]||0);});
  if(scopeWarn)total*=.7;
  if(s.kind!=='PRODUCT'&&product<1)total*=.8;
  return {total:Math.round(total*1000)/1000,parts:parts,shared:cc.shared,keywordHits:hits,scopeHits:st,appHits:app,scopeNote:scopeNote,scopeWarn:scopeWarn};
}

function matchedRequirementIds(q,s,sc){
  var ids=[];q.items.forEach(function(i){
    var v=(i.value+' '+i.label).toLowerCase();
    if(i.group==='product'&&s.productIds.indexOf(q.productId)>=0)ids.push(i.id);
    else if(i.concept&&s.concepts.indexOf(i.concept)>=0)ids.push(i.id);
    else if(i.label==='Voltage'&&sc.scopeNote)ids.push(i.id);
    else if((i.group==='environment'||i.group==='application')&&sc.appHits.some(function(h){return v.indexOf(h)>=0;}))ids.push(i.id);
    else if(sc.keywordHits.some(function(k){return v.indexOf(k.toLowerCase())>=0;}))ids.push(i.id);
  });return ids;
}
function explain(q,s,sc){
  var bits=[];
  if(sc.parts.product===1)bits.push(q.inferred&&q.inferred.product?'Your wording describes '+q.inferred.product.toLowerCase()+'s (inferred from meaning, not a named product; check it), which this standard is written for.':'Written for the product you described ('+(q.productLabel||q.product.label)+').');
  else if(sc.parts.product>0)bits.push('Covers the same product family as your '+(q.productLabel||'product').toLowerCase()+'.');
  if(sc.shared.length)bits.push('Shares the concepts '+sc.shared.slice(0,4).join(', ')+'.');
  if(sc.scopeNote)bits.push(sc.scopeNote);
  if(sc.appHits.length)bits.push('Its scope includes '+sc.appHits.slice(0,3).join(', ')+' use, which matches your application.');
  if(sc.keywordHits.length&&!sc.shared.length)bits.push('Your text mentions '+sc.keywordHits.slice(0,3).map(function(k){return '“'+k+'”';}).join(', ')+'.');
  if(s.kind!=='PRODUCT')bits.push('This is a '+{TEST_METHOD:'test method',CODE_OF_PRACTICE:'code of practice',TERMINOLOGY:'terminology standard',SAFETY:'safety standard',SYSTEM:'system standard'}[s.kind]+', not a product specification.');
  if(sc.scopeWarn)bits.push('Caution: '+sc.scopeWarn);
  return bits.join(' ');
}

/* ---- version check against standards the specification itself mentions */
function famKey(body,number,part){return [String(body||'IS').replace(/\s+/g,'').toUpperCase(),number,String(part||'').replace(/\s+/g,'').replace(/section/i,'Sec').toLowerCase()].join('|');}
function currentOf(s){var seen=0;while(s&&s.superseded_by&&s.superseded_by.length&&seen<5){var n=kbGet(s.superseded_by[0]);if(!n)break;s=n;seen++;}return s;}
function versionChecks(q){
  return q.items.filter(function(i){return i.group==='standards'&&i.std;}).map(function(i){
    var d=i.std,k=famKey(d.body==='IS/IEC'?'IS/IEC':d.body,d.number,d.part);
    var fam=KB().filter(function(s){return famKey(s.body,s.number,s.part)===k;});
    if(!fam.length&&!d.part){var parts=KB().filter(function(s){return s.number===d.number&&!s.archived;});
      if(parts.length){var cur0=parts.filter(function(s){return s.status==='CURRENT';});
        return {ref:i.value,itemId:i.id,result:'NO_EDITION',current:(cur0[0]||parts[0]).standard_id,
          message:'Cited without a part number or edition. The knowledge base has: '+(cur0.length?cur0:parts).map(function(s){return s.is_number;}).join('; ')+'. Name the exact part and edition in the tender.'};}}
    if(!fam.length)return {ref:i.value,itemId:i.id,result:'NOT_IN_KB',message:'Not in the knowledge base, so its edition can’t be checked here.'};
    var cur=fam.filter(function(s){return s.status==='CURRENT';}).sort(function(a,b){return (b.year||0)-(a.year||0);})[0]||currentOf(fam[0]);
    if(!fam.some(function(s){return s.status==='CURRENT';})&&cur&&famKey(cur.body,cur.number,cur.part)!==k)
      return {ref:i.value,itemId:i.id,result:'VERSION_REVIEW',current:cur.standard_id,referenced:fam[0].standard_id,
        message:'VERSION REVIEW REQUIRED. '+fam[0].is_number+' is recorded as superseded; the knowledge base points to '+cur.is_number+' instead. StandIQ has not changed your reference.'};
    var refd=d.year?fam.filter(function(s){return s.year===d.year;})[0]:null;
    if(!d.year)return {ref:i.value,itemId:i.id,result:'NO_EDITION',current:cur.standard_id,message:'No edition year is given. The current edition in the knowledge base is '+cur.is_number+'.'};
    if(cur.year===d.year)return {ref:i.value,itemId:i.id,result:'CURRENT',current:cur.standard_id,message:'This is the current edition in the knowledge base.'};
    if(cur.year&&d.year<cur.year)return {ref:i.value,itemId:i.id,result:'VERSION_REVIEW',current:cur.standard_id,referenced:refd?refd.standard_id:null,
      message:'VERSION REVIEW REQUIRED. The specification cites the '+d.year+' edition; the current edition in the knowledge base is '+cur.is_number+'. StandIQ has not changed your reference.'};
    return {ref:i.value,itemId:i.id,result:'UNKNOWN_EDITION',current:cur.standard_id,message:'The '+d.year+' edition is not recorded in the knowledge base (latest recorded: '+cur.is_number+'). Check the year.'};
  });
}

/* ---- certification evaluation with conditions */
function evalCondition(rule,q){
  if(rule.cond==='led'){if(q.hasLED)return {state:'met',text:'Your specification describes LED lighting.'};return {state:'unknown',text:'Applies only if the luminaires are LED. The specification doesn’t say.'};}
  if(rule.cond==='kva10'){if(!q.kva.length)return {state:'unknown',text:'No UPS rating was found; applies up to 10 kVA.'};var m=Math.max.apply(null,q.kva);return m<=10?{state:'met',text:'Stated rating '+m+' kVA is within 10 kVA.'}:{state:'not_met',text:'Stated rating '+m+' kVA is above 10 kVA, outside this entry.'};}
  if(rule.cond==='dia8'){if(!q.dia.length)return {state:'unknown',text:'No bar diameter was found; the order excludes sizes below 8 mm.'};var mn=Math.min.apply(null,q.dia);return mn>=8?{state:'met',text:'All stated diameters are 8 mm or more.'}:{state:'partly',text:'Sizes below 8 mm ('+mn+' mm) are outside the order.'};}
  if(rule.cond==='solarbattery'){return /solar|photovoltaic|pv\b/.test(q.text)?{state:'met',text:'The battery is for a solar application.'}:{state:'unknown',text:'Applies to batteries for solar PV use; the specification doesn’t say.'};}
  return null;
}
function certChecks(q,stdIds,alliedIds){
  alliedIds=alliedIds||[];
  var fams=stdIds.map(function(id){var s=kbGet(id);return s?famKey(s.body,s.number,s.part):null;});
  var out=[];
  KB_CERTS.forEach(function(r){
    var byProduct=q.productId&&r.products.indexOf(q.productId)>=0;
    var bySelf=r.standards.some(function(id){return stdIds.indexOf(id)>=0;});
    var byFam=r.standards.some(function(id){var s=kbGet(id);return s&&fams.indexOf(famKey(s.body,s.number,s.part))>=0;});
    var byAllied=r.standards.some(function(id){return alliedIds.indexOf(id)>=0;});
    if(!byProduct&&!bySelf&&!byFam&&!byAllied)return;
    var c=evalCondition(r,q),status=r.status;
    if(r.data_status!=='VERIFIED'&&status==='MANDATORY')status='REVIEW_REQUIRED';
    if(status==='MANDATORY'&&c&&c.state!=='met')status='CONDITIONAL';
    if(c&&c.state==='not_met')status='NOT_FOUND';
    out.push({rule:r.id,status:status,basis:byProduct?'product':(bySelf||byFam)?'standard':'related',condition:c});
  });
  return out;
}

/* ---- the run */
function recommend(a){
  var q=buildQuery(a),W=weights();
  var ranked=KB().filter(isActiveStd).map(function(s){var sc=scoreStandard(q,s,W),la=learnFor(q,s.standard_id);
      if(la&&la.adj)sc.total=Math.max(0,Math.min(1,Math.round((sc.total+la.adj)*1000)/1000));return {s:s,sc:sc,la:la};})
    .filter(function(x){return x.sc.total>=THRESH.possible||(x.la&&x.la.add>0&&x.la.adj>0);}).sort(function(x,y){return y.sc.total-x.sc.total;}).slice(0,8);
  var items=ranked.map(function(x){
    return {standard_id:x.s.standard_id,score:x.sc.total,strength:x.sc.total>=THRESH.strong?'STRONG':'POSSIBLE',breakdown:x.sc.parts,
      matched:matchedRequirementIds(q,x.s,x.sc),explanation:explain(q,x.s,x.sc)+learnNote(x.la)+(x.la&&x.la.add>0&&x.sc.total<THRESH.possible?' Shown because experts added it for this product before.':''),shared:x.sc.shared,data_status:x.s.data_status,
      learned:x.la&&x.la.adj?{adj:x.la.adj,keep:x.la.keep,remove:x.la.remove,add:x.la.add,version:x.la.version}:null};
  });
  var primary=items.map(function(i){return i.standard_id;});
  var allied=[],seen={};primary.forEach(function(id){seen[id]=1;});
  items.slice(0,5).forEach(function(it){
    KB_RELATIONSHIPS.forEach(function(r){
      if(r.from!==it.standard_id||r.type==='SUPERSEDES')return;var t=kbGet(r.to);if(!t||t.archived)return;
      var cur=currentOf(t);if(seen[cur.standard_id])return;seen[cur.standard_id]=1;
      allied.push({standard_id:cur.standard_id,type:r.type,via:it.standard_id,basis:r.basis,note:r.note,rel:r.id});
    });
  });
  var versions=versionChecks(q);
  var certs=certChecks(q,items.filter(function(i){return i.strength==='STRONG';}).map(function(i){return i.standard_id;}),allied.map(function(x){return x.standard_id;}));
  return {engine:ENGINE_REC_VERSION,run_at:new Date().toISOString(),weights:W,thresholds:THRESH,learning:S.learning&&S.learning.enabled!==false?{version:S.learning.version,applied:items.filter(function(i){return i.learned;}).length}:null,
    query:{productId:q.productId,product:q.productLabel,inferred:q.inferred,domain:q.domain,concepts:q.concepts.slice(0,20)},
    items:items,noMatch:!items.some(function(i){return i.strength==='STRONG';}),allied:allied,versions:versions,certs:certs};
}

/* ---- relationship graph (SVG) around one standard */
function relsOf(id){
  var out=[];KB_RELATIONSHIPS.forEach(function(r){if(r.from===id)out.push({other:r.to,type:r.type,dir:'out',r:r});else if(r.to===id)out.push({other:r.from,type:r.type==='SUPERSEDES'?'SUPERSEDED_BY':r.type,dir:'in',r:r});});
  var s=kbGet(id);if(s){(s.superseded_by||[]).forEach(function(x){if(!out.some(function(o){return o.other===x;}))out.push({other:x,type:'SUPERSEDED_BY',dir:'in',r:null});});}
  return out;
}
function shortNum(s){return s?(s.is_number||s.standard_id).replace(/^IS\/IEC /,'IS/IEC ').replace(/:\d{4}$/,function(m){return m;}):'';}
function graphSVG(id){
  var s=kbGet(id),rels=relsOf(id).filter(function(r){return kbGet(r.other);});
  if(!rels.length)return '<p class="muted" style="margin:0;font-size:14px">No relationships are recorded for this standard in the knowledge base.</p>';
  var W=640,H=Math.max(320,120+rels.length*18),cx=W/2,cy=H/2,R=Math.min(W,H)/2-70;
  var nodes=rels.map(function(r,i){var a=-Math.PI/2+i*2*Math.PI/rels.length;return {r:r,x:cx+R*1.25*Math.cos(a),y:cy+R*Math.sin(a)};});
  var h='<svg viewBox="0 0 '+W+' '+H+'" class="graph" role="img" aria-label="Standards related to '+esc(s.is_number)+'">';
  nodes.forEach(function(n){var c=REL_COLOR[n.r.type]||'#8A96A3';h+='<line x1="'+cx+'" y1="'+cy+'" x2="'+n.x.toFixed(1)+'" y2="'+n.y.toFixed(1)+'" stroke="'+c+'" stroke-width="2"'+(n.r.r&&n.r.r.basis==='CURATED'?' stroke-dasharray="5 4"':'')+' opacity=".85"/>';});
  nodes.forEach(function(n){var o=kbGet(n.r.other),c=REL_COLOR[n.r.type]||'#8A96A3',lab=shortNum(o);var w=Math.max(96,lab.length*6.4+20);
    h+='<a href="#/standard/'+encodeURIComponent(o.standard_id)+'"><g class="gnode"><rect x="'+(n.x-w/2).toFixed(1)+'" y="'+(n.y-17).toFixed(1)+'" width="'+w.toFixed(1)+'" height="34" rx="9" fill="var(--surface)" stroke="'+c+'" stroke-width="2"/>'+
      '<text x="'+n.x.toFixed(1)+'" y="'+(n.y+1).toFixed(1)+'" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--fg)">'+esc(lab)+'</text>'+
      '<text x="'+n.x.toFixed(1)+'" y="'+(n.y+12).toFixed(1)+'" text-anchor="middle" font-size="9.5" fill="var(--muted)">'+esc(REL_LABEL[n.r.type]||n.r.type)+'</text></g><title>'+esc(o.title)+'</title></a>';});
  var cl=shortNum(s),cw=Math.max(120,cl.length*7+24);
  h+='<rect x="'+(cx-cw/2)+'" y="'+(cy-20)+'" width="'+cw+'" height="40" rx="11" fill="var(--accent)"/><text x="'+cx+'" y="'+(cy+5)+'" text-anchor="middle" font-size="13" font-weight="800" fill="var(--accent-ink)">'+esc(cl)+'</text></svg>';
  var types={};rels.forEach(function(r){types[r.type]=1;});
  h+='<div class="glegend">'+Object.keys(types).map(function(t){return '<span><i style="background:'+(REL_COLOR[t]||'#8A96A3')+'"></i>'+esc(REL_LABEL[t]||t)+'</span>';}).join('')+'<span><i class="dash"></i>Dashed: curated association, review required</span></div>';
  return h;
}

/* ================================================================ WORKFLOW (phases 12–13)
   Officer data lives in analyses/<officer>/items/<id> (only the officer writes it).
   Expert decisions live in reviews/<expert>/items/<officer>__<id> (only that expert writes it).
   The status everyone sees is derived from both, so neither side can overwrite the other. */
S.revByExpert={};S.reviews={};S.claudeView={};S.revDraft={};S.pick=null;
var revSubs={};
function rebuildReviews(){
  var m={};Object.keys(S.revByExpert).forEach(function(u){(S.revByExpert[u]||[]).forEach(function(d){
    if(d.reviewer!==u)return;var k=d.analysis_owner+'__'+d.analysis_id;if(!m[k]||(d.updated_at||'')>(m[k].updated_at||''))m[k]=d;});});
  S.reviews=m;
}
function syncReviewSubs(){
  if(!S.db)return;
  var ex=Object.keys(S.roles).filter(function(u){return S.roles[u].role==='STANDARDS_EXPERT';}).slice(0,30);
  ex.forEach(function(u){if(revSubs[u])return;
    revSubs[u]=S.db.collection('reviews/'+u+'/items').onSnapshot(function(snap){S.revByExpert[u]=snap.docs.map(function(d){return Object.assign({},d.data(),{_id:d.id});});rebuildReviews();schedule();},function(e){storageFail(e);});});
  Object.keys(revSubs).forEach(function(u){if(ex.indexOf(u)<0){revSubs[u]();delete revSubs[u];delete S.revByExpert[u];rebuildReviews();}});
}
function reviewOf(a){return S.reviews[a.owner_id+'__'+a.id]||null;}
function effStatus(a){
  if(a.status==='SUBMITTED'){var r=reviewOf(a);return r&&r.submission===a.submission?r.status:'SUBMITTED_FOR_REVIEW';}
  return a.status==='ANALYSIS_READY'?'ANALYSIS_READY':'DRAFT';
}
function reportStatus(a){return {DRAFT:'DRAFT',ANALYSIS_READY:'DRAFT',SUBMITTED_FOR_REVIEW:'PENDING_EXPERT_VERIFICATION',UNDER_REVIEW:'PENDING_EXPERT_VERIFICATION',
  APPROVED:'EXPERT_VERIFIED',REJECTED:'REJECTED',REVISION_REQUIRED:'REVISION_REQUIRED',CLARIFICATION_REQUIRED:'CLARIFICATION_REQUIRED'}[effStatus(a)];}
function officerCanEdit(a){return myRole()==='PROCUREMENT_OFFICER'&&a.owner_id===S.uid&&['DRAFT','ANALYSIS_READY','REVISION_REQUIRED'].indexOf(effStatus(a))>=0;}
canEditReq=officerCanEdit;

/* ---------------- officer actions */
function saveOfficer(a,patch,audit,okMsg){
  if(S.reqBusy)return Promise.resolve();
  S.reqBusy=true;schedule();
  patch.updated_at=new Date().toISOString();
  return S.db.doc(docPath(a)).update(patch).then(function(){if(audit)record(audit[0],Object.assign({analysis_id:a.id,entity_type:'analysis',entity_id:a.id},audit[1]||{}));if(okMsg)toast(okMsg);})
    .catch(function(){toast('That couldn’t be saved. Check your connection and try again.');}).then(function(){S.reqBusy=false;schedule();});
}
function runRecommendation(a){
  if(!a.requirements){toast('Extract the requirements first.');return;}
  var t=function(){return new Date().toISOString();};
  var rec=recommend(a),stages=(a.stages||[]).filter(function(s){return ['SEMANTIC_SEARCH','STANDARDS_RANKED','RELATED_CHECKED','VERSION_CHECKED','CERTIFICATION_CHECKED','READY_FOR_REVIEW'].indexOf(s.key)<0;});
  stages=stages.concat([{key:'SEMANTIC_SEARCH',at:rec.run_at},{key:'STANDARDS_RANKED',at:t()},{key:'RELATED_CHECKED',at:t()},{key:'VERSION_CHECKED',at:t()},{key:'CERTIFICATION_CHECKED',at:t()},{key:'READY_FOR_REVIEW',at:t()}]);
  var sel=rec.items.filter(function(i){return i.strength==='STRONG';}).map(function(i){return i.standard_id;});
  var status=effStatus(a)==='REVISION_REQUIRED'?a.status:'ANALYSIS_READY';
  saveOfficer(a,{recommendations:rec,selected:sel,stages:stages,status:status},
    ['RUN_RECOMMENDATION',{after:{strong:rec.items.filter(function(i){return i.strength==='STRONG';}).length,possible:rec.items.filter(function(i){return i.strength==='POSSIBLE';}).length,allied:rec.allied.length,no_match:rec.noMatch,engine:rec.engine}}],
    rec.noMatch?'No sufficiently matching standard found.':'Standards found.');
}
function toggleSelect(a,id){
  var sel=(a.selected||[]).slice(),i=sel.indexOf(id),on=i<0;if(on)sel.push(id);else sel.splice(i,1);
  var s=kbGet(id);
  saveOfficer(a,{selected:sel},['UPDATE_ANALYSIS',{entity_type:'recommendation',entity_id:id,after:{selected:on,standard:s?s.is_number:id},reason:on?'Officer selected the standard':'Officer deselected the standard'}]);
}
function submitForReview(a){
  if(!a.recommendations){toast('Find standards first.');return;}
  var note=(S.revDraft.submitNote||'').trim();
  if(!(a.selected||[]).length&&!note){toast('Select at least one standard, or explain in the note why none apply.');return;}
  var n=(a.submission||0)+1;
  saveOfficer(a,{status:'SUBMITTED',submission:n,submitted_at:new Date().toISOString(),submit_note:note||null},
    ['SUBMIT_REVIEW',{after:{submission:n,selected:(a.selected||[]).map(function(id){var s=kbGet(id);return s?s.is_number:id;}),note:note||null}}],'Sent for expert review.');
  S.revDraft={};
}
function answerClarification(a){
  var r=reviewOf(a),ans=(S.revDraft.answer||'').trim();
  if(!ans){toast('Write your answer first.');return;}
  var list=(a.clarifications||[]).concat([{submission:a.submission,question:r?r.clarification_request:null,answer:ans,at:new Date().toISOString()}]);
  saveOfficer(a,{clarifications:list,submission:(a.submission||0)+1,submitted_at:new Date().toISOString()},
    ['SUBMIT_CLARIFICATION',{after:{answer:ans.slice(0,300)}}],'Answer sent. The analysis is back with the expert.');
  S.revDraft={};
}

/* ---------------- expert actions: one review document per analysis, written only by its reviewer */
function revPath(a){return 'reviews/'+S.uid+'/items/'+a.owner_id+'__'+a.id;}
function myReview(a){var r=reviewOf(a);return r&&r.reviewer===S.uid&&r.submission===a.submission?r:null;}
function saveReview(a,mutate,audit,okMsg){
  if(S.reqBusy)return;var cur=myReview(a);if(!cur)return;
  var d=clone(cur);delete d._id;var ret=mutate(d);if(ret===false)return;
  d.updated_at=new Date().toISOString();S.reqBusy=true;schedule();
  S.db.doc(revPath(a)).set(d).then(function(){if(audit)record(audit[0],Object.assign({analysis_id:a.id,entity_type:'review',entity_id:a.owner_id+'__'+a.id},audit[1]||{}));S.revDraft={};if(okMsg)toast(okMsg);})
    .catch(function(){toast('That couldn’t be saved. Try again.');}).then(function(){S.reqBusy=false;schedule();});
}
function startReview(a){
  if(a.owner_id===S.uid){toast('You can’t review an analysis you created.');return;}
  var prev=reviewOf(a),now=new Date().toISOString();
  var hist=prev?(prev.history||[]).concat([{submission:prev.submission,status:prev.status,reviewer:prev.reviewer,decided_at:prev.decided_at||null,reason:prev.decision_reason||prev.clarification_request||null}]):[];
  var d={analysis_owner:a.owner_id,analysis_id:a.id,analysis_title:a.title,submission:a.submission,reviewer:S.uid,status:'UNDER_REVIEW',decisions:{},added:[],explanations:{},notes:[],
    clarification_request:null,decision_reason:null,verified:[],history:hist.slice(-20),started_at:now,updated_at:now};
  S.reqBusy=true;schedule();
  S.db.doc(revPath(a)).set(d).then(function(){record('START_REVIEW',{analysis_id:a.id,entity_type:'review',entity_id:a.owner_id+'__'+a.id,after:{submission:a.submission}});toast('Review started.');})
    .catch(function(){toast('The review couldn’t be started.');}).then(function(){S.reqBusy=false;schedule();});
}
function reviewCandidates(a){var r=myReview(a)||reviewOf(a);return (a.selected||[]).concat(r?r.added.map(function(x){return x.standard_id;}):[]);}
function decide(a,id,d){
  var reason=(S.revDraft['why_'+id]||'').trim();
  if(d==='REMOVE'&&!reason){toast('Give a reason for removing it.');return;}
  var s=kbGet(id);
  saveReview(a,function(r){r.decisions[id]={d:d,reason:reason||null,at:new Date().toISOString()};},
    d==='REMOVE'?['REMOVE_STANDARD',{after:{standard:s?s.is_number:id,reason:reason}}]:['UPDATE_ANALYSIS',{after:{standard:s?s.is_number:id,decision:'kept'},reason:'Expert kept (verified) the standard'}]);
}
function expertAdd(a,id){
  var reason=(S.revDraft.addReason||'').trim(),s=kbGet(id);
  if(!s){return;}if(!reason){toast('Say why you’re adding it.');return;}
  if(reviewCandidates(a).indexOf(id)>=0){toast('That standard is already in the list.');return;}
  saveReview(a,function(r){r.added.push({standard_id:id,reason:reason,at:new Date().toISOString()});r.decisions[id]={d:'KEEP',reason:reason,at:new Date().toISOString()};},['ADD_STANDARD',{after:{standard:s.is_number,reason:reason}}],'Standard added.');
  S.pick=null;
}
function expertExplain(a,id){var t=(S.revDraft['exp_'+id]||'').trim();if(!t)return;var s=kbGet(id);
  saveReview(a,function(r){r.explanations[id]=t;},['UPDATE_ANALYSIS',{after:{standard:s?s.is_number:id,explanation:t.slice(0,300)},reason:'Expert edited the explanation'}],'Explanation saved.');S.revDraft['editexp_'+id]=false;}
function expertNote(a){var t=(S.revDraft.note||'').trim();if(!t){toast('Write the note first.');return;}
  saveReview(a,function(r){r.notes.push({text:t,at:new Date().toISOString(),by:S.uid});},['ADD_NOTE',{after:{note:t.slice(0,300)}}],'Note added.');}
function expertDecision(a,kind){
  var reason=(S.revDraft.decision||'').trim();
  if(a.owner_id===S.uid){toast('You can’t decide on your own analysis.');return;}
  if(kind!=='APPROVED'&&!reason){toast(kind==='CLARIFICATION_REQUIRED'?'Write the question for the officer.':'Give the reason.');return;}
  var r=myReview(a);if(!r)return;
  var cands=reviewCandidates(a);
  if(kind==='APPROVED'){
    var undecided=cands.filter(function(id){return !r.decisions[id];});
    if(undecided.length){toast('Keep or remove every standard before approving ('+undecided.length+' left).');return;}
    if(!cands.some(function(id){return r.decisions[id].d==='KEEP';})&&!reason){toast('Nothing is kept. Add a reason to approve with no standards, or reject instead.');return;}
  }
  var act={APPROVED:'APPROVE_REVIEW',REJECTED:'REJECT_REVIEW',REVISION_REQUIRED:'REQUEST_REVISION',CLARIFICATION_REQUIRED:'REQUEST_CLARIFICATION'}[kind];
  saveReview(a,function(d){d.status=kind;d.decided_at=new Date().toISOString();
    if(kind==='CLARIFICATION_REQUIRED')d.clarification_request=reason;else d.decision_reason=reason||null;
    if(kind==='APPROVED')d.verified=cands.filter(function(id){return d.decisions[id]&&d.decisions[id].d==='KEEP';});},
    [act,{after:{status:kind,reason:reason||null,verified:kind==='APPROVED'?cands.filter(function(id){return r.decisions[id]&&r.decisions[id].d==='KEEP';}).map(function(id){var s=kbGet(id);return s?s.is_number:id;}):undefined}}],
    {APPROVED:'Approved. The officer can now generate the verified report.',REJECTED:'Rejected.',REVISION_REQUIRED:'Sent back for revision.',CLARIFICATION_REQUIRED:'Question sent to the officer.'}[kind]);
}

/* ---------------- optional Claude double-check (advisory, not saved, never adds standards) */
function deeperMatch(a){
  var key=a.owner_id+'__'+a.id;if(S.claudeView[key]&&S.claudeView[key].busy)return;
  S.claudeView[key]={busy:true};schedule();
  claude.use('sample').then(function(sample){
    if(!sample)throw {code:'not_granted'};
    var cands=a.recommendations.items.map(function(i){var s=kbGet(i.standard_id);return {id:s.standard_id,is_number:s.is_number,title:s.title,scope:s.scope};});
    var reqs=(a.requirements.items||[]).filter(function(i){return !i.removed;}).map(function(i){return i.label+': '+i.value;}).join('\n');
    var prompt='You are checking standards recommendations for an Indian public procurement tool.\nRules: use ONLY the candidate standards listed below. Never add, rename or invent a standard, edition, amendment or certification requirement. If none fit, say so.\n'+
      'For EACH candidate id give fit "strong", "partial" or "weak" and one short sentence of reason grounded in the requirement and the candidate scope.\nReply with JSON only: {"assessments":[{"id":"...","fit":"strong|partial|weak","reason":"..."}],"overall":"one sentence"}\n\n'+
      'Procurement requirement (title: '+a.title+'):\n'+reqs.slice(0,3000)+'\n\nOriginal text excerpt:\n'+pagesOf(a).map(function(p){return p.text;}).join('\n').slice(0,2500)+'\n\nCandidates:\n'+JSON.stringify(cands);
    return sample.json(prompt,{modelTier:'default',cache:true});
  }).then(function(res){
    var ids=a.recommendations.items.map(function(i){return i.standard_id;});
    var items=(res&&Array.isArray(res.assessments)?res.assessments:[]).filter(function(x){return x&&ids.indexOf(x.id)>=0&&['strong','partial','weak'].indexOf(x.fit)>=0;})
      .map(function(x){return {id:x.id,fit:x.fit,reason:String(x.reason||'').slice(0,300)};});
    S.claudeView[key]={at:new Date().toISOString(),items:items,overall:res&&typeof res.overall==='string'?res.overall.slice(0,300):null,dropped:(res&&res.assessments?res.assessments.length:0)-items.length};
    schedule();
  }).catch(function(e){S.claudeView[key]={error:e&&e.code==='not_granted'?'Claude isn’t available in this view, or permission was declined.':e&&e.code==='rate_limited'?'Too many requests just now. Try again in a minute.':'The double-check didn’t complete.'};schedule();});
}

/* ---------------- UI helpers */
var STRENGTH={STRONG:['Strong match','ok'],POSSIBLE:['Possible match','warn']};
var DSTAT={VERIFIED:['Verified source','ok'],REVIEW_REQUIRED:['Review required','violet'],DEMO:['Sample (unofficial)','warn'],UNKNOWN:['Unknown','neutral'],ARCHIVED:['Archived','neutral']};
function badge(txt,tone,title){return '<span class="badge t-'+tone+'" style="background:transparent"'+(title?' title="'+esc(title)+'"':'')+'>'+esc(txt)+'</span>';}
function dsBadge(ds){var d=DSTAT[ds]||DSTAT.UNKNOWN;return badge(d[0],d[1]);}
function stdStatusBadge(s){return s.status==='CURRENT'?badge('Current edition','cyan'):badge(s.status==='WITHDRAWN'?'Withdrawn':'Superseded','bad');}
function pct(v){return Math.round(v*100)+'%';}
function bars(b,W){
  var lab={semantic:'Meaning',keyword:'Keywords',product:'Product',domain:'Domain',scope:'Scope',application:'Application'};
  return '<div class="bars">'+Object.keys(lab).map(function(k){return '<div class="barrow"><span>'+lab[k]+' <em>×'+Math.round((W[k]||0)*100)+'%</em></span><span class="bar2"><i style="width:'+Math.round((b[k]||0)*100)+'%"></i></span><b class="tnum">'+pct(b[k]||0)+'</b></div>';}).join('')+'</div>';
}
function reqChips(a,ids){
  var m={};(a.requirements?a.requirements.items:[]).forEach(function(i){m[i.id]=i;});
  var list=ids.map(function(id){return m[id];}).filter(Boolean);
  return list.length?'<div class="chipline">'+list.map(function(i){return '<span class="chip">'+esc(i.label)+': '+esc(i.value)+'</span>';}).join('')+'</div>':'<p class="hint">No individual requirement lines matched; the match comes from the overall meaning of the text.</p>';
}
function certLine(a,id){
  var rec=a.recommendations;if(!rec)return '';var s=kbGet(id);
  var hits=rec.certs.filter(function(c){var r=KB_CERTS.filter(function(x){return x.id===c.rule;})[0];return r&&r.standards.some(function(sid){var t=kbGet(sid);return t&&s&&famKey(t.body,t.number,t.part)===famKey(s.body,s.number,s.part);});});
  if(!hits.length)return '<span class="faint" style="font-size:12.5px">No certification rule for this standard in the knowledge base</span>';
  return hits.map(function(c){var st=CERT_STATUS[c.status];return badge(st[0]+' – '+SCHEME_LABEL[KB_CERTS.filter(function(x){return x.id===c.rule;})[0].scheme].replace('BIS ',''),st[1]);}).join(' ');
}
function versionLine(s){
  if(!s)return '';var bits=[s.is_number,s.revision||null].filter(Boolean).join(' · ');
  var am=s.amendments==null?'amendments not recorded':(s.amendments.length?s.amendments.length+' amendment'+(s.amendments.length>1?'s':''):'no amendments');
  return '<span class="faint" style="font-size:12.5px">'+esc(bits)+' · '+am+(s.supersedes&&s.supersedes.length?' · supersedes '+esc(s.supersedes.map(function(x){var t=kbGet(x);return t?t.is_number:x;}).join(', ')):'')+'</span>';
}

/* ---------------- sections */
function recSection(a){
  var rec=a.recommendations,editable=officerCanEdit(a),key=a.owner_id+'__'+a.id,rv=reviewOf(a),mine=myReview(a),reviewing=!!(mine&&mine.status==='UNDER_REVIEW');
  if(!rec){
    if(!a.requirements)return '';
    return card('Standards',editable?empty('book','Standards haven’t been searched yet.','StandIQ will search its knowledge base using the reviewed requirements, rank the matches and explain each one.')+
      '<p style="text-align:center;margin:-14px 0 22px"><button class="btn btn-p" data-act="wf-run"'+(S.reqBusy?' disabled':'')+'>'+ic('search')+'Find standards</button></p>':
      empty('book','Standards haven’t been searched yet.','The officer runs the search after reviewing the requirements.'));
  }
  var W=rec.weights,sel=a.selected||[],cv=S.claudeView[key];
  var strong=rec.items.filter(function(i){return i.strength==='STRONG';}),possible=rec.items.filter(function(i){return i.strength==='POSSIBLE';});
  function card1(it){
    var s=kbGet(it.standard_id);if(!s)return '';var on=sel.indexOf(it.standard_id)>=0,dec=(mine||rv)&&(mine||rv).decisions?(mine||rv).decisions[it.standard_id]:null;
    var expTxt=(rv&&rv.explanations&&rv.explanations[it.standard_id])||null,cl=cv&&cv.items?cv.items.filter(function(x){return x.id===it.standard_id;})[0]:null;
    var h='<article class="rec'+(on?' on':'')+'"><div class="rec-top">'+
      (editable?'<label class="sel"><input type="checkbox" data-act="wf-sel" data-id="'+esc(it.standard_id)+'"'+(on?' checked':'')+(S.reqBusy?' disabled':'')+'><span class="sr">Select '+esc(s.is_number)+'</span></label>':(on?'<span class="selmark" title="Selected by the officer">'+ic('check','i-sm')+'</span>':''))+
      '<div style="flex:1;min-width:0"><div class="row" style="flex-wrap:wrap;gap:6px 10px"><a class="rowlink rec-num" href="#/standard/'+encodeURIComponent(s.standard_id)+'/'+encodeURIComponent(a.owner_id)+'/'+encodeURIComponent(a.id)+'">'+esc(s.is_number)+'</a>'+
      badge(STRENGTH[it.strength][0],STRENGTH[it.strength][1])+dsBadge(s.data_status)+stdStatusBadge(s)+(dec?badge(dec.d==='KEEP'?'Kept by expert':'Removed by expert',dec.d==='KEEP'?'ok':'bad',dec.reason||''):'')+'</div>'+
      '<p class="rec-title">'+esc(s.title)+'</p></div><div class="score"><b class="display tnum">'+pct(it.score)+'</b><span>relevance</span></div></div>'+
      '<p class="rec-why"><b>Why recommended.</b> '+esc(expTxt||it.explanation)+(expTxt?' <span class="faint">(edited by the expert)</span>':'')+'</p>'+
      (cl?'<p class="rec-why" style="border-left-color:var(--violet)"><b>Claude’s double-check:</b> '+esc(cl.fit)+' fit. '+esc(cl.reason)+'</p>':'')+
      '<details><summary>Score breakdown and matched requirements</summary>'+bars(it.breakdown,W)+reqChips(a,it.matched)+'</details>'+
      '<div class="rec-foot">'+versionLine(s)+'<span>'+certLine(a,it.standard_id)+'</span></div>';
    if(reviewing&&sel.concat((mine.added||[]).map(function(x){return x.standard_id;})).indexOf(it.standard_id)>=0)h+=decisionControls(a,it.standard_id,mine);
    return h+'</article>';
  }

/* ---------------- workflow events */
app.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-act]');if(!t)return;var act=t.getAttribute('data-act');
  if(act.indexOf('wf-')!==0&&act.indexOf('rv-')!==0)return;
  var m=route().match(/^\/analysis\/([^/]+)\/([^/]+)$/);if(!m)return;
  var a=findAnalysis(decodeURIComponent(m[1]),decodeURIComponent(m[2]));if(!a)return;var id=t.getAttribute('data-id');
  if(act==='wf-claude'){deeperMatch(a);return;}
  if(act.indexOf('wf-')===0){if(a.owner_id!==S.uid||myRole()!=='PROCUREMENT_OFFICER')return;
    if(act==='wf-run'&&officerCanEdit(a))runRecommendation(a);
    else if(act==='wf-sel'){ev.preventDefault();if(officerCanEdit(a))toggleSelect(a,id);}
    else if(act==='wf-submit'&&officerCanEdit(a))submitForReview(a);
    else if(act==='wf-answer'&&effStatus(a)==='CLARIFICATION_REQUIRED')answerClarification(a);
    return;}
  if(myRole()!=='STANDARDS_EXPERT')return;
  if(act==='rv-start'&&effStatus(a)==='SUBMITTED_FOR_REVIEW')startReview(a);
  else if(!myReview(a)||myReview(a).status!=='UNDER_REVIEW')return;
  else if(act==='rv-keep')decide(a,id,'KEEP');
  else if(act==='rv-remove')decide(a,id,'REMOVE');
  else if(act==='rv-editexp'){S.revDraft['editexp_'+id]=!S.revDraft['editexp_'+id];schedule();}
  else if(act==='rv-saveexp')expertExplain(a,id);
  else if(act==='rv-note')expertNote(a);
  else if(act==='rv-pick'){S.pick={q:''};schedule();}
  else if(act==='rv-pick-close'){S.pick=null;schedule();}
  else if(act==='rv-add')expertAdd(a,id);
  else if(act==='rv-approve')expertDecision(a,'APPROVED');
  else if(act==='rv-clarify')expertDecision(a,'CLARIFICATION_REQUIRED');
  else if(act==='rv-revise')expertDecision(a,'REVISION_REQUIRED');
  else if(act==='rv-reject')expertDecision(a,'REJECTED');
});
app.addEventListener('input',function(ev){var k=ev.target.getAttribute&&ev.target.getAttribute('data-rv');if(!k)return;
  if(k==='pickq'){S.pick.q=ev.target.value;clearTimeout(pickT);pickT=setTimeout(schedule,200);}else S.revDraft[k]=ev.target.value;});

function pageKBEdit(id){

function kbSave(id){
  var isNew=id==='new',base=isNew?null:kbGet(id),d=S.kbDraft;S.kbErr=null;
  var sid=isNew?String(d.standard_id||'').trim():id;
  if(isNew&&!/^[A-Za-z0-9-]{3,60}$/.test(sid)){S.kbErr='Record id must be 3–60 letters, digits or dashes.';return schedule();}
  if(isNew&&kbGet(sid)){S.kbErr='A record with that id already exists.';return schedule();}
  if(!String(d.title||'').trim()){S.kbErr='Title is required.';return schedule();}
  function list(v){return Array.isArray(v)?v:String(v||'').split(',').map(function(x){return x.trim();}).filter(Boolean);}
  var rec=Object.assign({},base||S_({}),{standard_id:sid,is_number:String(d.is_number||'').trim()||null,title:String(d.title).trim(),year:d.year?+d.year:null,revision:d.revision||null,
    status:d.status,kind:d.kind,domain:d.domain,product_category:d.product_category||'',scope:String(d.scope||'').trim(),keywords:list(d.keywords),productIds:list(d.productIds),concepts:list(d.concepts),
    source:String(d.source||'').trim(),source_url:String(d.source_url||'').trim(),last_verified:String(d.last_verified||'').trim(),data_status:d.data_status,notes:d.notes||null});
  var m=String(rec.is_number||'').match(/^(IS\/IEC|IS\/ISO|IS|SP)\s*(\d+)(?:\s*\(([^)]+)\))?/i);if(m){rec.body=m[1].toUpperCase();rec.number=m[2];rec.part=m[3]||null;}
  if(rec.data_status==='VERIFIED'){
    if(base&&base.data_status==='DEMO'){S.kbErr='A sample record can’t be marked verified. Create a new record from an authoritative source instead.';return schedule();}
    if(!rec.source||!/^https:\/\//.test(rec.source_url)||!/^\d{4}-\d{2}-\d{2}$/.test(rec.last_verified)){S.kbErr='Verified records need a source, an https source URL and a last-verified date (YYYY-MM-DD).';return schedule();}
  }
  var changed=base?SIGNIFICANT.filter(function(k){return JSON.stringify(base[k])!==JSON.stringify(rec[k]);}):[];
  if(base&&base.data_status==='VERIFIED'&&rec.data_status==='VERIFIED'&&changed.length&&!d._reverified){rec.data_status='REVIEW_REQUIRED';toast('Significant fields changed, so the record is now “Review required”.');}
  if(base&&changed.length)rec.change_log=(base.change_log||[]).concat([logEntry('EDITED',{changed:changed})]);
  rec.updated_by=S.uid;rec.updated_at=new Date().toISOString();delete rec._edited;
  S.reqBusy=true;schedule();
  S.db.doc('kb/'+sid).set(JSON.parse(JSON.stringify(rec))).then(function(){
    record(isNew?'KB_CREATE':'KB_UPDATE',{entity_type:'standard',entity_id:sid,before:base?{is_number:base.is_number,title:base.title,year:base.year,status:base.status,data_status:base.data_status}:null,after:{is_number:rec.is_number,title:rec.title,year:rec.year,status:rec.status,data_status:rec.data_status,changed:changed}});
    S.kbDraft=null;toast('Record saved.');go('/standard/'+encodeURIComponent(sid));
  }).catch(function(){S.kbErr='The record couldn’t be saved. Only standards experts with edit access can change the knowledge base.';}).then(function(){S.reqBusy=false;schedule();});
}
function kbArchive(id,on){
  var s=kbGet(id);if(!s)return;var rec=JSON.parse(JSON.stringify(Object.assign({},s,{archived:on,updated_by:S.uid,updated_at:new Date().toISOString()})));delete rec._edited;
  S.db.doc('kb/'+id).set(rec).then(function(){record(on?'KB_ARCHIVE':'KB_RESTORE',{entity_type:'standard',entity_id:id,after:{is_number:s.is_number,archived:on}});toast(on?'Archived. It won’t be recommended.':'Restored.');})
    .catch(function(){toast('Only standards experts with edit access can change the knowledge base.');});
}
function kbExport(){
  var data=JSON.stringify({schema:'standiq.kb/1.0',exported_at:new Date().toISOString(),standards:KB(),relationships:KB_RELATIONSHIPS,certifications:KB_CERTS,categories:KB_CATEGORIES},null,2);
  saveFile('standiq-knowledge-base.json',new Blob([data],{type:'application/json'}),function(){record('EXPORT_REPORT',{entity_type:'knowledge_base',after:{format:'json',records:KB().length}});});
}
function kbImport(file){
  if(file.size>2*1024*1024){toast('The file is over 2 MB.');return;}
  readBuf(file).then(function(b){var j=JSON.parse(new TextDecoder().decode(b));var arr=Array.isArray(j)?j:j.standards;if(!Array.isArray(arr))throw 0;
    var add=arr.filter(function(r){return r&&/^[A-Za-z0-9-]{3,60}$/.test(r.standard_id||'')&&r.title&&!kbGet(r.standard_id);}).slice(0,50);
    if(!add.length){toast('No new records found in the file. Existing ids are skipped.');return;}
    return Promise.all(add.map(function(r){var rec=JSON.parse(JSON.stringify(Object.assign(S_({}),r,{data_status:r.data_status==='DEMO'?'DEMO':'REVIEW_REQUIRED',archived:false,updated_by:S.uid,updated_at:new Date().toISOString()})));
      return S.db.doc('kb/'+r.standard_id).set(rec).then(function(){record('KB_CREATE',{entity_type:'standard',entity_id:r.standard_id,after:{is_number:r.is_number||null,title:r.title,data_status:rec.data_status},reason:'Imported from JSON'});});}))
      .then(function(){toast(add.length+' record(s) imported as “Review required”.');});
  }).catch(function(){toast('That file isn’t a valid StandIQ knowledge-base export.');});
}

/* ================================================================ SPECIFICATION CHECK
   The problem statement's three failures, checked on the text itself: relevant standards omitted, outdated
   versions cited, incomplete requirements. Plus: mandatory certification the text never mentions. */
function specCheck(a){
  var rec=a.recommendations,req=a.requirements;if(!rec||!req)return null;
  var items=req.items.filter(function(i){return !i.removed;}),out=[];
  var cited=items.filter(function(i){return i.group==='standards'&&i.std;}).map(function(i){return famKey(i.std.body==='IS/IEC'?'IS/IEC':i.std.body,i.std.number,i.std.part);});
  var citedNums=items.filter(function(i){return i.group==='standards'&&i.std;}).map(function(i){return i.std.number;});
  rec.versions.forEach(function(v){
    if(v.result==='VERSION_REVIEW')out.push({sev:'high',kind:'Outdated version',text:v.ref+': '+v.message.replace(/^VERSION REVIEW REQUIRED\.\s*/,''),std:v.current});
    else if(v.result==='NO_EDITION')out.push({sev:'medium',kind:'Edition not stated',text:v.ref+': '+v.message,std:v.current});
    else if(v.result==='UNKNOWN_EDITION')out.push({sev:'medium',kind:'Edition not recognised',text:v.ref+': '+v.message,std:v.current});
    else if(v.result==='NOT_IN_KB')out.push({sev:'low',kind:'Cannot verify',text:v.ref+' is not in the knowledge base, so it could not be checked.'});
  });
  rec.items.filter(function(i){return i.strength==='STRONG';}).forEach(function(i,k){
    var s=kbGet(i.standard_id);if(!s)return;
    if(cited.indexOf(famKey(s.body,s.number,s.part))>=0||citedNums.indexOf(s.number)>=0)return;
    if(k===0)out.push({sev:'high',kind:'Relevant standard not cited',text:s.is_number+' ('+s.title+') is the best match for this product but the specification doesn’t mention it.',std:s.standard_id});
    else out.push({sev:'medium',kind:'Consider citing',text:s.is_number+' ('+s.title+') also fits this product strongly.',std:s.standard_id});
  });
  var certSaid=items.some(function(i){return i.group==='certification';});
  rec.certs.filter(function(c){return c.basis!=='related'&&(c.status==='MANDATORY'||c.status==='CONDITIONAL');}).forEach(function(c){
    if(certSaid)return;var r=KB_CERTS.filter(function(x){return x.id===c.rule;})[0];
    out.push({sev:c.status==='MANDATORY'?'high':'medium',kind:'Certification not stated',text:(c.status==='MANDATORY'?'Mandatory ':'Possibly required ')+SCHEME_LABEL[r.scheme]+' ('+r.order+') is not mentioned in the specification.'});
  });
  var miss=req.missing.filter(function(m){return m.group!=='product';});
  if(miss.length)out.push({sev:miss.length>3?'medium':'low',kind:'Incomplete requirements',text:miss.length+' detail'+(miss.length>1?'s':'')+' usually specified for this product '+(miss.length>1?'are':'is')+' missing: '+miss.slice(0,5).map(function(m){return m.label;}).join(', ')+(miss.length>5?'…':'')+'.'});
  var order={high:0,medium:1,low:2};out.sort(function(x,y){return order[x.sev]-order[y.sev];});
  return {findings:out,high:out.filter(function(f){return f.sev==='high';}).length};
}
function specCheckCard(a,title){
  var c=specCheck(a);if(!c)return '';
  var SEV={high:['Fix before publishing','bad'],medium:['Should fix','warn'],low:['Note','neutral']};
  var head=c.findings.length?(c.high?c.high+' issue'+(c.high>1?'s':'')+' to fix before this goes into a tender.':'No blocking issues. '+c.findings.length+' point'+(c.findings.length>1?'s':'')+' to improve.'):'No issues found. Standards cited, editions current, certification stated, checklist complete.';
  var body='<p style="margin:0 0 12px;font-size:14.5px;font-weight:600;color:'+(c.high?'var(--bad)':'var(--ok)')+'">'+esc(head)+'</p>'+
    (c.findings.length?'<ul class="alist">'+c.findings.map(function(f){var s=SEV[f.sev];return '<li><div style="flex:1;min-width:0"><b>'+esc(f.kind)+'.</b> <span class="muted">'+esc(f.text)+'</span>'+
      (f.std&&kbGet(f.std)?' <a class="rowlink" style="font-size:13px;font-weight:600" href="#/standard/'+encodeURIComponent(f.std)+'">'+esc(kbGet(f.std).is_number)+'</a>':'')+'</div>'+badge(s[0],s[1])+'</li>';}).join('')+'</ul>':'')+
    '<p class="hint" style="margin-top:10px">Checks the text for the problems that cause procurement disputes: omitted standards, outdated editions, unstated certification and missing technical details.</p>';
  return card(title||'Specification check',body,c.findings.length?badge(c.findings.length+' finding'+(c.findings.length>1?'s':''),c.high?'bad':'warn'):badge('Ready','ok'));
}

S.portal={q:'LED street lights for a government eco-park, 230 V, 50 Hz, outdoor use',res:null};
function portalPayload2(text){
  var it=text.length<200?'QUERY':'TEXT';
  var a={id:'portal',owner_id:S.uid,title:suggestTitle(text)||text.slice(0,80),original_text:text,input_type:it};
  a.requirements=extractRequirements([{page:null,text:text}],{inputType:it});a.recommendations=recommend(a);
  var r=a.recommendations,sc=specCheck(a);
  function std(id){var s=kbGet(id);return {standard_id:id,is_number:s.is_number,title:s.title,status:s.status,edition_year:s.year,data_status:s.data_status,source_url:s.source_url};}
  return {schema:'standiq.portal-recommend/1.0',verification:'NOT_EXPERT_VERIFIED',engine:r.engine,
    requirements:a.requirements.items.map(function(i){return {group:i.group,label:i.label,value:i.value,status:i.status};}),
    languages:a.requirements.languages,missing_information:a.requirements.missing.map(function(m){return m.label;}),no_sufficient_match:r.noMatch,
    recommended_standards:r.items.map(function(i){return Object.assign(std(i.standard_id),{relevance_score:i.score,strength:i.strength,explanation:i.explanation});}),
    allied_standards:r.allied.map(function(x){return Object.assign(std(x.standard_id),{relationship:x.type,basis:x.basis});}),
    version_checks:r.versions.map(function(v){return {cited:v.ref,result:v.result,current:v.current?kbGet(v.current).is_number:null,message:v.message};}),
    certification:r.certs.filter(function(c){return c.basis!=='related';}).map(function(c){var k=KB_CERTS.filter(function(x){return x.id===c.rule;})[0];return {status:c.status,scheme:k.scheme,order:k.order,product:k.productLabel,condition:c.condition,source_url:k.source_url};}),
    specification_check:sc?sc.findings.map(function(f){return {severity:f.sev,kind:f.kind,detail:f.text};}):[],
    disclaimer:'Automated suggestions. Not a BIS approval or legal determination; have a standards expert verify before use.'};
}

/* ================================================================ COMPARE OVERLAPPING STANDARDS
   Answers "which one do I cite?" from knowledge-base facts only: series, relationship, type, focus, edition. */
function relBetween(a,b){return KB_RELATIONSHIPS.filter(function(r){return (r.from===a&&r.to===b)||(r.from===b&&r.to===a);})[0]||null;}
function focusOf(s){var t=(s.title+' '+s.scope).toLowerCase();
  if(/performance/.test(t))return 'performance';if(/safety|requirements and tests|protection/.test(t)&&s.kind!=='TEST_METHOD')return 'safety';
  if(s.kind==='TEST_METHOD')return 'testing';if(s.kind==='TERMINOLOGY')return 'terms';return 'product';}
function overlapInsight(idA,idB){
  var A=kbGet(idA),B=kbGet(idB);if(!A||!B)return null;
  var why=[],verdict=null;
  var cur=function(s){return currentOf(s);};
  if(A.number===B.number&&(A.part||'')===(B.part||'')&&A.year!==B.year){
    var newer=(A.year||0)>(B.year||0)?A:B,older=newer===A?B:A;
    why.push(older.is_number+' and '+newer.is_number+' are editions of the same standard.');
    verdict=cur(older).standard_id===newer.standard_id||older.status!=='CURRENT'?'Cite only the current edition, '+newer.is_number+'.':'Both editions are recorded as current; confirm which one the tender should cite.';
  }else{
    if(A.number===B.number&&A.part&&B.part){
      var p1=/^Part 1$/.test(A.part)?A:(/^Part 1$/.test(B.part)?B:null),other=p1===A?B:A;
      if(p1){why.push('Same series (IS '+A.number+'). '+p1.is_number+' sets the general requirements; '+other.is_number+' adds the particular requirements for '+other.title.split(/[–—-]\s*/).pop().toLowerCase()+'.');verdict='Cite both: the particular part is read together with Part 1.';}
      else why.push('Both are parts of the IS '+A.number+' series, each for a different product type.');
    }
    var r=relBetween(A.standard_id,B.standard_id);
    if(r&&r.type==='SUPERSEDES'){var nw=kbGet(r.from),od=kbGet(r.to);why.push(nw.is_number+' replaces '+od.is_number+(r.basis==='BIS'?' (per the BIS record)':'')+'. '+(r.note||''));verdict='Cite only '+nw.is_number+'; do not cite '+od.is_number+'.';r=null;}
    if(r){var f=kbGet(r.from),t=kbGet(r.to);why.push(f.is_number+' lists '+t.is_number+' as a '+(REL_LABEL[r.type]||r.type).toLowerCase()+(r.basis==='BIS'?' (listed on the BIS record)':' (curated link, review required)')+'.');if(!verdict&&r.type!=='RELATED_PRODUCT')verdict='Cite both: '+f.is_number+' depends on '+t.is_number+'.';}
    var fa=focusOf(A),fb=focusOf(B);
    if(fa!==fb){why.push(A.is_number+' covers '+{performance:'performance',safety:'safety',testing:'a test method',terms:'terms and definitions',product:'the product specification'}[fa]+'; '+B.is_number+' covers '+{performance:'performance',safety:'safety',testing:'a test method',terms:'terms and definitions',product:'the product specification'}[fb]+'.');
      if(!verdict&&((fa==='safety'&&fb==='performance')||(fa==='performance'&&fb==='safety')))verdict='Cite both: one sets safety requirements, the other performance.';
      if(!verdict&&(fa==='testing'||fb==='testing'))verdict='Cite the product standard; include the test method where the tender specifies testing.';}
    else if(A.kind==='PRODUCT'&&B.kind==='PRODUCT'&&A.product_category===B.product_category){
      why.push('Both are product specifications for '+A.product_category.toLowerCase()+', for different product variants.');
      if(!verdict)verdict='Cite the one whose scope matches your product; check the scopes below.';}
    if(A.status!=='CURRENT'||B.status!=='CURRENT'){var old=A.status!=='CURRENT'?A:B;why.push(old.is_number+' is '+old.status.toLowerCase()+'.');verdict=verdict||'Do not cite '+old.is_number+'; use '+cur(old).is_number+'.';}
  }
  return {why:why,verdict:verdict||'Read both scopes; cite each one that applies to what you are buying.',a:A,b:B};
}
function compareLink(a,b,ctx){return '#/compare/'+encodeURIComponent(a)+'/'+encodeURIComponent(b)+(ctx?'/'+encodeURIComponent(ctx.owner)+'/'+encodeURIComponent(ctx.id):'');}
function overlapNote(rec,ctx){
  if(!rec||rec.items.length<2)return '';
  var x=overlapInsight(rec.items[0].standard_id,rec.items[1].standard_id);if(!x)return '';
  return '<div class="note t-blue" style="margin:0 0 14px;align-items:flex-start">'+ic('layers')+'<span><b>The top two overlap.</b> '+esc(x.verdict)+' <a href="'+compareLink(rec.items[0].standard_id,rec.items[1].standard_id,ctx)+'" style="font-weight:600">Compare side by side</a></span></div>';
}
function pageCompare(idA,idB,owner,aid){
  var x=overlapInsight(idA,idB);if(!x)return card('',empty('book','One of these standards isn’t in the knowledge base.',''));
  var A=x.a,B=x.b,a=owner&&aid?findAnalysis(owner,aid):null,items=a&&a.recommendations?a.recommendations.items:[];
  function score(s){var i=items.filter(function(t){return t.standard_id===s.standard_id;})[0];return i?pct(i.score)+' relevance ('+(i.strength==='STRONG'?'strong':'possible')+')':'—';}
  function refs(s,types){var l=KB_RELATIONSHIPS.filter(function(r){return r.from===s.standard_id&&types.indexOf(r.type)>=0;}).map(function(r){var t=kbGet(r.to);return t?'<a class="rowlink" href="#/standard/'+encodeURIComponent(t.standard_id)+'">'+esc(t.is_number)+'</a>':'';}).filter(Boolean);return l.length?l.join('<br>'):'<span class="faint">None recorded</span>';}
  function certs(s){var k=famKey(s.body,s.number,s.part);var l=KB_CERTS.filter(function(r){return r.standards.some(function(id){var t=kbGet(id);return t&&famKey(t.body,t.number,t.part)===k;});});
    return l.length?l.map(function(r){return badge(CERT_STATUS[r.data_status==='VERIFIED'?r.status:'REVIEW_REQUIRED'][0],CERT_STATUS[r.data_status==='VERIFIED'?r.status:'REVIEW_REQUIRED'][1])+' '+esc(SCHEME_LABEL[r.scheme]);}).join('<br>'):'<span class="faint">No rule recorded</span>';}
  function am(s){return s.amendments==null?'<span class="faint">Not recorded</span>':s.amendments.length?s.amendments.map(function(x){return 'No. '+x.no+(x.date?' ('+esc(x.date)+')':'');}).join(', '):'None issued';}
  var rows=[['Standard',function(s){return '<a class="rowlink rec-num" href="#/standard/'+encodeURIComponent(s.standard_id)+'">'+esc(s.is_number)+'</a>';}],['Title',function(s){return esc(s.title);}],
    ['Type',function(s){return esc(KIND_LABEL[s.kind]||s.kind);}],['Focus',function(s){return esc({performance:'Performance',safety:'Safety',testing:'Test method',terms:'Terminology',product:'Product specification'}[focusOf(s)]);}],
    ['Edition',function(s){return esc((s.year||'Year not recorded')+(s.revision?' · '+s.revision:''))+' '+stdStatusBadge(s);}],['Amendments',am],['Scope',function(s){return '<span class="muted">'+esc(s.scope)+'</span>';}],
    ['Reads with',function(s){return refs(s,['NORMATIVE_REFERENCE','SAFETY_STANDARD','INSTALLATION_STANDARD','TERMINOLOGY_STANDARD']);}],['Test methods',function(s){return refs(s,['TEST_METHOD']);}],
    ['Certification',certs],['Data',function(s){return dsBadge(s.data_status)+' <span class="faint" style="font-size:12.5px">checked '+esc(s.last_verified||'—')+'</span>';}]];
  if(a)rows.splice(2,0,['For “'+a.title+'”',score]);
  var others=KB().filter(function(s){return !s.archived&&s.standard_id!==A.standard_id&&s.domain===A.domain;}).slice(0,40);
  return '<div class="head"><div>'+(a?backLink('#/analysis/'+encodeURIComponent(owner)+'/'+encodeURIComponent(aid),a.title):backLink('#/standard/'+encodeURIComponent(A.standard_id),A.is_number))+
      '<h1 class="h1 display">Compare standards</h1><p class="sub">Which one should the tender cite? Based only on knowledge-base facts.</p></div>'+
      '<div><label class="label" for="cmp-b">Compare '+esc(A.is_number)+' with</label><select id="cmp-b" class="field" style="width:300px" data-cmp="'+esc(A.standard_id)+'">'+others.map(function(s){return '<option value="'+esc(s.standard_id)+'"'+(s.standard_id===B.standard_id?' selected':'')+'>'+esc(s.is_number)+'</option>';}).join('')+'</select></div></div>'+
    card('What to cite','<p class="display" style="margin:0 0 10px;font-size:22px;line-height:1.3">'+esc(x.verdict)+'</p><ul class="conds" style="margin:0">'+x.why.map(function(w){return '<li>'+esc(w)+'</li>';}).join('')+'</ul>')+
    '<div style="margin-top:20px">'+card('','<div class="tbl-wrap"><table style="min-width:760px;table-layout:fixed"><thead><tr><th style="width:170px"></th><th>'+esc(A.is_number)+'</th><th>'+esc(B.is_number)+'</th></tr></thead><tbody>'+
      rows.map(function(r){return '<tr><td style="font-weight:600;vertical-align:top">'+esc(r[0])+'</td><td style="vertical-align:top;line-height:1.55">'+r[1](A)+'</td><td style="vertical-align:top;line-height:1.55">'+r[1](B)+'</td></tr>';}).join('')+'</tbody></table></div>','',true)+'</div>';
}

/* ================================================================ REVISION ALERTS
   Experts record amendments, replacements and withdrawals. Each change goes into the standard's change log.
   Any saved analysis relying on that standard, created before the change, gets an alert until the officer handles it. */
function logEntry(kind,extra){return Object.assign({at:new Date().toISOString(),by:S.uid,kind:kind},extra||{});}
function saveKbRecord(rec){var r=JSON.parse(JSON.stringify(rec));delete r._edited;r.updated_by=S.uid;r.updated_at=new Date().toISOString();return S.db.doc('kb/'+r.standard_id).set(r);}
function recordAmendment(id){
  var s=kbGet(id),d=S.revForm||{},no=parseInt(d.no,10),date=String(d.date||'').trim(),sum=String(d.summary||'').trim();
  if(!s)return;if(!no||no<1){toast('Enter the amendment number.');return;}if(!/^\d{4}-\d{2}$/.test(date)){toast('Enter the date as YYYY-MM.');return;}if(sum.length<5){toast('Summarise what the amendment changes.');return;}
  if((s.amendments||[]).some(function(a){return a.no===no;})){toast('Amendment No. '+no+' is already recorded.');return;}
  var rec=Object.assign({},s,{amendments:(s.amendments||[]).concat([{no:no,date:date,summary:sum,data_status:'REVIEW_REQUIRED'}]),
    change_log:(s.change_log||[]).concat([logEntry('AMENDMENT',{no:no,date:date,summary:sum})])});
  saveKbRecord(rec).then(function(){record('KB_UPDATE',{entity_type:'standard',entity_id:id,after:{is_number:s.is_number,amendment:no,date:date},reason:'Amendment recorded'});S.revForm=null;toast('Amendment recorded. Analyses that rely on it now show an alert.');})
    .catch(function(){toast('Only standards experts with edit access can change the knowledge base.');});
}
function recordReplacement(id){
  var s=kbGet(id),d=S.revForm||{},mode=d.mode||'replace',t=d.target?kbGet(d.target):null,note=String(d.note||'').trim();
  if(!s)return;
  if(mode==='replace'){
    if(!t||t.standard_id===id){toast('Choose the standard that replaces it.');return;}
    var old=Object.assign({},s,{status:'SUPERSEDED',superseded_by:[t.standard_id],change_log:(s.change_log||[]).concat([logEntry('SUPERSEDED',{to:t.standard_id,to_number:t.is_number,note:note||null})])});
    var nw=Object.assign({},t,{supersedes:(t.supersedes||[]).filter(function(x){return x!==id;}).concat([id])});
    Promise.all([saveKbRecord(old),saveKbRecord(nw)]).then(function(){record('KB_UPDATE',{entity_type:'standard',entity_id:id,before:{status:s.status},after:{status:'SUPERSEDED',superseded_by:t.is_number},reason:'Replaced by a newer edition'});S.revForm=null;toast(s.is_number+' is now marked as replaced by '+t.is_number+'.');})
      .catch(function(){toast('Only standards experts with edit access can change the knowledge base.');});
  }else{
    if(note.length<5){toast('Say why it was withdrawn.');return;}
    var w=Object.assign({},s,{status:'WITHDRAWN',change_log:(s.change_log||[]).concat([logEntry('WITHDRAWN',{note:note})])});

  var W=Math.max(260,width||620),GAP=10,ROW=44,rows=[],row=[],w=0;

/* ================================================================ FLOWING-THREADS BACKGROUND
   Own canvas renderer: fine lines start bundled on the left and fan out to the right, bending on slow,
   layered currents. The pointer nudges their phase and swell. Only behind the sign-in screens and the top of
   Find standards; paused when hidden; a single still frame when motion is reduced. */
var TH={el:null,ctx:null,w:0,h:0,dpr:1,raf:0,mx:.5,my:.5,tx:.5,ty:.5,on:false,last:0};
function thSetup(){
  if(TH.el)return true;
  var c=document.createElement('canvas');c.id='threads';c.setAttribute('aria-hidden','true');document.body.insertBefore(c,document.body.firstChild);
  var ctx=null;try{ctx=c.getContext&&c.getContext('2d');}catch(e){}
  if(!ctx){c.remove();return false;}
  TH.el=c;TH.ctx=ctx;thResize();
  window.addEventListener('resize',thResize);
  window.addEventListener('pointermove',function(e){TH.tx=e.clientX/Math.max(1,innerWidth);TH.ty=e.clientY/Math.max(1,innerHeight);},{passive:true});
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&TH.on)thLoop();});
  return true;
}
function thResize(){if(!TH.el)return;var r=TH.el.getBoundingClientRect();TH.dpr=Math.min(window.devicePixelRatio||1,1.75);TH.w=r.width;TH.h=r.height;TH.el.width=Math.max(1,Math.round(r.width*TH.dpr));TH.el.height=Math.max(1,Math.round(r.height*TH.dpr));thDraw(TH.last);}
function thColor(){var v=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#1F3A93';return v;}
function thDraw(t){
  var c=TH.ctx;if(!c)return;var W=TH.w,H=TH.h,d=TH.dpr;c.setTransform(d,0,0,d,0,0);c.clearRect(0,0,W,H);
  TH.mx+=(TH.tx-TH.mx)*.04;TH.my+=(TH.ty-TH.my)*.04;
  var N=30,col=thColor(),time=t/1000,cy=H*.46,spread=H*.6,amp=H*(.13+.05*(TH.my-.5)),shift=(TH.mx-.5)*1.2;
  var m=/^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(col),rgb=m?[parseInt(m[1],16),parseInt(m[2],16),parseInt(m[3],16)].join(','):'31,58,147';
  var g=c.createLinearGradient?c.createLinearGradient(0,0,W,0):null;
  if(g){g.addColorStop(0,'rgba('+rgb+',0)');g.addColorStop(.26,'rgba('+rgb+',1)');g.addColorStop(1,'rgba('+rgb+',1)');}
  c.lineWidth=1;c.strokeStyle=g||col;   /* lines fade in from the left, so the bundle never reads as one hard stroke */
  for(var k=0;k<N;k++){

    for(var s=0;s<=96;s++){

      var n1=Math.sin(x*(4.6+p*1.3)+time*.35+p*2.1+shift),n2=Math.sin(x*(10.1+p*2.4)-time*.22+p*5.3)*.45,n3=Math.sin(x*2.1+time*(.1+p*.05)+p*9.7)*.6;
      var Y=cy+(p-.5)*spread*fan+(n1+n2+n3)*amp*fan*(.6+p*.6);
      if(s===0)c.moveTo(X,Y);else c.lineTo(X,Y);

function thLoop(){cancelAnimationFrame(TH.raf);var step=function(now){if(!TH.on||document.hidden){TH.raf=0;return;}
  if(now-TH.last>32){TH.last=now;thDraw(now);}TH.raf=requestAnimationFrame(step);};TH.raf=requestAnimationFrame(step);}
function thUpdate(){
  var r=route(),gate=S.phase!=='ready'||!S.rolesReady||!myRole();
  var want=gate||r==='/find';
  document.body.classList.toggle('threads-full',gate);
  if(want&&!thSetup())return;
  if(want===TH.on){if(want&&TH.el)thResize();return;}
  TH.on=want;document.body.classList.toggle('threads-on',want);
  if(want){thResize();if(REDUCE_MOTION)thDraw(8000);else thLoop();}else{cancelAnimationFrame(TH.raf);TH.raf=0;}
}

function parseCSV(text){
  var rows=[],row=[],cur='',q=false;text=String(text).replace(/^﻿/,'');
  for(var i=0;i<text.length;i++){var c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else if(c==='"')q=true;else if(c===','){row.push(cur);cur='';}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur='';}else cur+=c;}
  if(cur||row.length){row.push(cur);rows.push(row);}

/* Read any supported file (PDF, DOCX, TXT) to pages of text, with its fingerprint. */
function readAnyFile(file){
  var name=cleanName(file.name),info,buf;
  return Promise.resolve().then(function(){
    if(file.size===0)throw fail('EMPTY','This file is empty.');
    if(file.size>MAX_BYTES)throw fail('TOO_LARGE','This file is '+fmtBytes(file.size)+'. The limit is 10 MB.');
    return readBuf(file);
  }).then(function(b){buf=b;info=sniff(name,file.type,new Uint8Array(buf,0,Math.min(buf.byteLength,4096)));
    return Promise.all([sha256(buf),info.ext==='pdf'?extractPdf(buf):info.ext==='docx'?extractDocx(buf):extractTxt(buf)]);
  }).then(function(r){var pages=r[1].pages,all=pages.map(function(p){return p.text;}).join('\n\n');
    if(all.replace(/\s/g,'').length<20)throw fail('NO_TEXT','No readable text was found. Scanned PDFs need OCR, which isn’t available yet.');
    if(all.length>MAX_CHARS)throw fail('TOO_LONG','This document has more than '+MAX_CHARS.toLocaleString()+' characters. Upload the technical part of the bid only.');
    return {name:name,kind:info.ext,size:file.size,sha256:r[0],pages:pages,words:words(all)};
  });
}

/* ================================================================ 1b. LEARNING FROM EXPERT DECISIONS
   Every Keep / Remove / Add by an expert is a training signal. An expert with edit access publishes the model
   (settings/learning); the engine then nudges scores by at most ±10 points per standard and product, and says so
   in the explanation. Nothing is hidden: the adjustments are listed on the Learning page and can be switched off. */
S.learning=null;
function learnKeyOf(productId,domain){return productId||(domain?'domain:'+domain:null);}
function learnKeyLabel(k){if(!k)return 'Any';if(k.indexOf('domain:')===0)return k.slice(7)+' (other products)';var p=productById(k);return p?p.label:k;}
function learnFor(q,id){
  var L=S.learning;if(!L||!L.enabled||!L.model)return null;var k=learnKeyOf(q.productId,q.domain);if(!k||!L.model[k]||!L.model[k][id])return null;
  var c=L.model[k][id],n=c.k+c.r+c.a;if(!n)return null;
  var rate=(c.k+c.a+1)/(n+2),conf=Math.min(1,n/5),adj=Math.round((rate-.5)*.2*conf*1000)/1000;
  return {adj:adj,keep:c.k,remove:c.r,add:c.a,n:n,key:k,version:L.version};
}
function learnNote(la){
  if(!la||!la.adj)return '';
  var p=learnKeyLabel(la.key).toLowerCase();
  return ' Learned from experts: kept '+la.keep+' time'+(la.keep===1?'':'s')+', removed '+la.remove+', added '+la.add+' in earlier reviews for '+p+' ('+(la.adj>0?'+':'')+Math.round(la.adj*100)+' points).';
}
/* All expert decisions visible to this viewer, one per standard per review round. */
function learnEvents(){
  var out=[];
  Object.keys(S.reviews).forEach(function(k){var r=S.reviews[k];if(!r||!r.decisions)return;
    var a=findAnalysis(r.analysis_owner,r.analysis_id),rec=a&&a.recommendations;if(!rec||!rec.query)return;
    var key=learnKeyOf(rec.query.productId,rec.query.domain);
    Object.keys(r.decisions).forEach(function(id){var d=r.decisions[id],added=(r.added||[]).some(function(x){return x.standard_id===id;});
      var idx=-1;rec.items.forEach(function(it,i){if(it.standard_id===id&&idx<0)idx=i;});
      out.push({key:key,id:id,d:d.d,added:added,rank:idx,strength:idx>=0?rec.items[idx].strength:null,at:d.at||r.updated_at,analysis:a.id,final:['APPROVED','REJECTED','REVISION_REQUIRED'].indexOf(r.status)>=0});});
  });
  return out;
}
function mkey(iso){var d=new Date(iso);return isNaN(d)?'':d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function learnStats(evs){
  var eng=evs.filter(function(e){return !e.added&&e.rank>=0;}),top=eng.filter(function(e){return e.rank===0;});
  function rate(l){var k=l.filter(function(e){return e.d==='KEEP';}).length;return l.length?{v:k/l.length,k:k,n:l.length}:null;}
  var now=new Date(),months=[];
  for(var i=5;i>=0;i--){var d=new Date(now.getFullYear(),now.getMonth()-i,15),key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    var m=top.filter(function(e){return mkey(e.at)===key;}),all=eng.filter(function(e){return mkey(e.at)===key;});
    months.push({key:key,label:d.toLocaleDateString(undefined,{month:'short'}),top:rate(m),all:rate(all)});}
  var cur=mkey(now.toISOString());
  return {decisions:evs.length,overall:rate(eng),top:rate(top),topMonth:rate(top.filter(function(e){return mkey(e.at)===cur;})),
    added:evs.filter(function(e){return e.added;}).length,removed:eng.filter(function(e){return e.d==='REMOVE';}).length,months:months};
}
function learnBuild(evs){
  var model={};evs.forEach(function(e){if(!e.key)return;var m=model[e.key]=model[e.key]||{},c=m[e.id]=m[e.id]||{k:0,r:0,a:0};
    if(e.added)c.a++;else if(e.d==='KEEP')c.k++;else if(e.d==='REMOVE')c.r++;});
  return model;
}
function learnPublish(){
  if(!kbEditor()){toast('Only a standards expert with edit access can publish the model.');return;}
  var evs=learnEvents();if(!evs.length){toast('There are no expert decisions to learn from yet.');return;}
  var prev=S.learning||{},st=learnStats(evs);
  var doc={enabled:prev.enabled!==false,version:(prev.version||0)+1,trained_at:new Date().toISOString(),trained_by:S.uid,model:learnBuild(evs),
    stats:{decisions:st.decisions,overall:st.overall,top:st.top,topMonth:st.topMonth,added:st.added,removed:st.removed,months:st.months}};
  S.db.doc('settings/learning').set(JSON.parse(JSON.stringify(doc))).then(function(){record('LEARN_RETRAIN',{entity_type:'settings',entity_id:'learning',after:{version:doc.version,decisions:st.decisions,agreement_top:st.top?Math.round(st.top.v*100):null}});toast('Model v'+doc.version+' published. New searches use it.');})
    .catch(function(){toast('Only editors can publish the learning model.');});
}
function learnToggle(on){
  if(!kbEditor()||!S.learning)return;
  S.db.doc('settings/learning').update({enabled:on}).then(function(){record('LEARN_TOGGLE',{entity_type:'settings',entity_id:'learning',after:{enabled:on}});toast(on?'Learning switched on.':'Learning switched off. Scores are back to the base engine.');}).catch(function(){toast('That couldn’t be saved.');});
}
function monthChart(months,field){
  var W=560,H=180,pl=34,pb=26,bw=(W-pl-10)/months.length;
  var h='<svg viewBox="0 0 '+W+' '+H+'" class="graph" role="img" aria-label="Expert agreement by month">';
  [0,.5,1].forEach(function(g){var y=(H-pb)-(H-pb-14)*g;h+='<line x1="'+pl+'" x2="'+(W-6)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line-soft)"/><text x="'+(pl-6)+'" y="'+(y+4)+'" font-size="10" text-anchor="end" fill="var(--faint)">'+Math.round(g*100)+'%</text>';});
  months.forEach(function(m,i){var r=m[field],x=pl+i*bw+bw*.2,w=bw*.6;
    if(r){var bh=(H-pb-14)*r.v;h+='<rect x="'+x.toFixed(1)+'" y="'+((H-pb)-bh).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+bh.toFixed(1)+'" fill="var(--accent)"><title>'+m.label+': '+Math.round(r.v*100)+'% of '+r.n+'</title></rect><text x="'+(x+w/2).toFixed(1)+'" y="'+((H-pb)-bh-5).toFixed(1)+'" font-size="10.5" text-anchor="middle" fill="var(--fg)">'+Math.round(r.v*100)+'%</text>';}
    else h+='<text x="'+(x+w/2).toFixed(1)+'" y="'+(H-pb-6)+'" font-size="10" text-anchor="middle" fill="var(--faint)">–</text>';
    h+='<text x="'+(x+w/2).toFixed(1)+'" y="'+(H-8)+'" font-size="11" text-anchor="middle" fill="var(--muted)">'+esc(m.label)+'</text>';});
  return h+'</svg>';
}
function agreementLine(){var L=S.learning,s=L&&L.stats;if(!s||!s.top)return null;return Math.round((s.topMonth||s.top).v*100)+'% agreement on top recommendations'+(s.topMonth?' this month':'');}
function pageLearning(){
  var live=myRole()==='STANDARDS_EXPERT',evs=learnEvents(),st=live?learnStats(evs):(S.learning&&S.learning.stats)||learnStats(evs),L=S.learning;
  var newSince=L&&L.trained_at?evs.filter(function(e){return (e.at||'')>L.trained_at;}).length:evs.length;
  function pc(r){return r?Math.round(r.v*100)+'%':'—';}
  var head='<div class="head"><div><h1 class="h1 display">Learning from experts</h1><p class="sub">Every time an expert keeps, removes or adds a standard, StandIQ learns. The score shows how often experts agree with what the engine put first.</p></div>'+
    (kbEditor()?'<span class="row">'+(L?'<button class="btn btn-s" data-act="ln-toggle">'+(L.enabled===false?'Switch learning on':'Switch learning off')+'</button>':'')+'<button class="btn btn-p" data-act="ln-train"'+(evs.length?'':' disabled')+'>'+ic('cpu')+'Retrain and publish</button></span>':'')+'</div>';
  var kp='<div class="kpis">'+kpi('Top recommendation agreement, this month',pc(st.topMonth),'check','ok',st.topMonth?st.topMonth.k+' of '+st.topMonth.n+' kept':'No decisions this month')+kpi('Agreement, all time',pc(st.overall),'shield','cyan',st.overall?st.overall.k+' of '+st.overall.n+' engine picks kept':'')+
    kpi('Decisions learned from',st.decisions,'scroll','violet',L?'Model v'+L.version+(newSince?' · '+newSince+' new since training':' · up to date'):'No model published yet')+kpi('Standards experts added',st.added,'plus','warn','Misses the engine should learn')+'</div>';
  var status=L?'<div class="note '+(L.enabled===false?'t-warn':'t-ok')+'" style="margin-top:12px">'+ic(L.enabled===false?'alert':'check')+'<span>'+(L.enabled===false?'Learning is switched off. Recommendations use the base engine only.':'Model v'+L.version+' is live, trained '+rel(L.trained_at)+' by '+esc(nameOf(L.trained_by))+'. Every recommendation that it changes says so.')+'</span></div>':
    '<div class="note t-neutral" style="margin-top:12px">'+ic('cpu')+'<span>No model has been published yet. '+(kbEditor()?'Once experts have reviewed a few analyses, use Retrain and publish.':'An expert with edit access publishes it once reviews have been made.')+'</span></div>';
  var model=L&&L.model?L.model:{},rows=[];
  Object.keys(model).forEach(function(k){Object.keys(model[k]).forEach(function(id){var la=learnFor({productId:k.indexOf('domain:')===0?null:k,domain:k.indexOf('domain:')===0?k.slice(7):null},id)||(function(){var c=model[k][id],n=c.k+c.r+c.a,rate=(c.k+c.a+1)/(n+2);return {adj:Math.round((rate-.5)*.2*Math.min(1,n/5)*1000)/1000,keep:c.k,remove:c.r,add:c.a,n:n};})();
    rows.push({k:k,id:id,la:la});});});
  rows.sort(function(x,y){return Math.abs(y.la.adj)-Math.abs(x.la.adj);});
  wantProfiles(L&&L.trained_by?[L.trained_by]:[]);
  var tbl=rows.length?'<div class="tbl-wrap"><table style="min-width:640px"><thead><tr><th>Product</th><th>Standard</th><th>Kept</th><th>Removed</th><th>Added</th><th>Adjustment</th></tr></thead><tbody>'+rows.slice(0,40).map(function(r){
      return '<tr><td>'+esc(learnKeyLabel(r.k))+'</td><td><a class="rowlink" href="#/standard/'+encodeURIComponent(r.id)+'">'+esc(stdNum(r.id))+'</a></td><td class="tnum">'+r.la.keep+'</td><td class="tnum">'+r.la.remove+'</td><td class="tnum">'+r.la.add+'</td><td class="tnum" style="font-weight:700;color:'+(r.la.adj>0?'var(--ok)':r.la.adj<0?'var(--bad)':'var(--faint)')+'">'+(r.la.adj>0?'+':'')+Math.round(r.la.adj*100)+' pts</td></tr>';}).join('')+'</tbody></table></div>':
    empty('cpu','No adjustments yet.','They appear here after the model is trained on expert decisions.');
  var how='<ul class="conds" style="margin:0"><li>Signals: <b>Keep</b> on an engine pick counts for it, <b>Remove</b> counts against it, and a standard the expert <b>adds</b> counts strongly for it next time.</li><li>Learned per product (or per domain when no product was identified).</li><li>Adjustment = (share kept − 50%) × 20 points, scaled by confidence until 5 decisions. So at most ±10 points.</li><li>A standard experts added can reappear as a possible match with the reason shown. It is never auto-selected.</li><li>Only an expert with edit access publishes a model, and every retrain is in the audit log.</li></ul>';
  return head+kp+status+'<div class="grid2"><div class="stack">'+card('Top recommendation agreement by month',monthChart(st.months||[],'top')+'<p class="hint">Share of reviews where the expert kept the engine’s first-ranked standard.'+(live?' Live from all reviews you can see.':' From the published model.')+'</p>')+card('Learned adjustments',tbl,'',!!rows.length)+'</div>'+
    '<div class="stack">'+card('How it learns',how)+card('This month',st.topMonth?'<p style="margin:0;font-size:15px">Experts agreed with <b>'+Math.round(st.topMonth.v*100)+'%</b> of top recommendations this month ('+st.topMonth.k+' of '+st.topMonth.n+').</p>':'<p class="muted" style="margin:0;font-size:14px">No review decisions yet this month.</p>')+'</div></div>';
}
